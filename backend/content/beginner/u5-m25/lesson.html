<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5 Module 25 | The Food Critic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        freakYellow: '#E4DF33',
                        freakDark: '#30302F',
                        freakBlue: '#93E5FF',
                        freakBg: '#111111'
                    },
                    fontFamily: {
                        bree: ['"Bree Serif"', 'serif'],
                        mont: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111111; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #app-container { width: 1280px; height: 720px; position: relative; background-color: #30302F; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        /* Typography System */
        .title-freak { font-family: 'Bree Serif', serif; font-weight: 400; text-transform: uppercase; }
        .text-freak { font-family: 'Montserrat', sans-serif; }
        
        /* Components */
        .btn-freak {
            background-color: #93E5FF; color: #30302F; font-family: 'Montserrat', sans-serif; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.05em; padding: 1rem 2rem; border: 4px solid #30302F;
            box-shadow: 4px 4px 0px #30302F; transition: all 0.2s ease; cursor: pointer;
        }
        .btn-freak:hover { background-color: #E4DF33; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #30302F; }
        .btn-freak:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; background-color: #ccc; }
        
        .slide-enter { animation: slideIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #30302F; }
        ::-webkit-scrollbar-thumb { background: #E4DF33; }

        /* ============ RESPONSIVE (mobile 360-820px) ============ */
        @media (max-width: 820px) {
            body { overflow-y: auto; height: auto; min-height: 100vh; padding: 1rem 0; }
            #app-container { width: 100%; height: auto; min-height: 100vh; box-shadow: none; }
            #slide-mount { flex-direction: column; }
            #slide-mount > [class*="pb-20"] { flex-direction: column; height: auto; min-height: 100%; }

            /* two-column splits stack on mobile */
            #slide-mount .w-1\/2,
            #slide-mount [class*="w-[45%]"],
            #slide-mount [class*="w-[55%]"],
            #slide-mount [class*="w-[380px]"],
            #slide-mount [class*="w-[500px]"] { width: 100%; height: auto; }
            #slide-mount [class*="mb-6"][class*="gap-6"] { flex-direction: column; }

            /* deck typography down to legible sizes */
            #slide-mount [class*="text-[110px]"] { font-size: 2.5rem; }
            #slide-mount .text-8xl { font-size: 2.25rem; }
            #slide-mount .text-7xl { font-size: 2rem; }

            /* big paddings down to 1rem */
            #slide-mount .p-12, #slide-mount .p-16 { padding: 1rem; }

            /* cheatsheet grid stacks */
            #slide-mount .grid-cols-3 { grid-template-columns: 1fr; }

            /* nav bars fit or wrap */
            #slide-mount [class*="absolute"][class*="bottom-6"] { padding-left: 1rem; padding-right: 1rem; flex-wrap: wrap; gap: 0.5rem; }
            #slide-mount [class*="absolute"][class*="bottom-8"],
            #slide-mount [class*="absolute"][class*="bottom-12"] { position: static; display: flex; justify-content: center; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }

            #app-container .btn-freak { min-height: 44px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="slide-mount" class="w-full h-full flex slide-enter"></div>
    </div>

    <script>
        const lessonData = [
            // SLIDE 0: OBJECTIVE
            {
                type: 'intro',
                unitModule: "UNIT 5 • MODULE 25",
                title: "THE UNKNOWN",
                objective: "Learn to talk about things, people, or places when you don't know exactly who or what they are. Master the mystery words.",
                bottomTag: "THE OBSERVER • PART 5"
            },
            
            // --- THE CHEAT CODE (GRAMMAR BASE) ---
            {
                type: 'cheatsheet',
                title: "THE CHEAT CODE",
                subtitle: "The street rules for the unknown.",
                rules: [
                    { title: "THE BASE", desc: "SOME = Positive/Offers.<br>ANY = Negative/Questions.<br>NO = Zero/Nothing.", example: "I have something.<br>Do you have anything?<br>I have nothing." },
                    { title: "THE ENDINGS", desc: "-THING = Objects.<br>-ONE / -BODY = People.<br>-WHERE = Places.", example: "Something (an object).<br>Someone (a person).<br>Somewhere (a place)." },
                    { title: "THE ARTICLES", desc: "Use 'A/An' for one unspecific thing. Use 'The' for a specific thing.", example: "I see a dog (any dog).<br>I see the dog (my dog)." }
                ]
            },

            // --- LEVEL 1: THE VIBE ---
            { type: 'transition', level: 1, title: "LEVEL 1: THE VIBE", desc: "The family is looking for lost items and dealing with mysteries. Pick the right word to complete their gossip based on logic." },
            
            {
                type: 'q_vibe', level: 1, qNum: 1,
                context: "Gelmy: 'Mijo, I hear a strange noise in the kitchen, but I am too scared to go check. There is ___ in the house!'",
                question: "What does Gelmy think is in the house?",
                options: ["...someone...", "...somewhere..."],
                correct: 0,
                rationale: "She hears a noise and is scared of an intruder. 'Someone' refers to a person. 'Somewhere' is a place.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What do you do if you hear a strange noise at night?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 2,
                context: "Titó: 'My carriel bag is completely empty. I checked all the pockets. I have ___ inside.'",
                question: "What does Titó have in his bag?",
                options: ["...anything...", "...nothing..."],
                correct: 1,
                rationale: "Because he says the bag is 'completely empty', the affirmative statement must be 'I have nothing'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Is there nothing in your pockets right now, or something?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 3,
                context: "El pa: 'Bro, I am so hungry, but there isn't ___ in the fridge. We need to go to the supermarket.'",
                question: "What word completes El pa's negative sentence?",
                options: ["...anything...", "...something..."],
                correct: 0,
                rationale: "In negative sentences (isn't), you must use 'anything' to mean zero items.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Is there anything to eat in your fridge right now?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 4,
                context: "Gelmy: 'I lost my favorite ring! I know it is ___ in this house, but I can't find it!'",
                question: "What is Gelmy talking about?",
                options: ["...someone...", "...somewhere..."],
                correct: 1,
                rationale: "She knows the ring is in a physical location inside the house. 'Somewhere' refers to an unknown place.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Have you ever lost something important somewhere in your house?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 5,
                context: "Titó: 'I want to travel, but I don't know where to go. I just want to go ___ warm.'",
                question: "Where does Titó want to go?",
                options: ["...somewhere...", "...something..."],
                correct: 0,
                rationale: "He is talking about traveling to a location. 'Somewhere' means an unspecified place.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'If you could go somewhere right now, where would it be?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 6,
                context: "El pa: 'Parce, did you see ___ taking my phone? It was on the table and now it's gone.'",
                question: "What is El pa asking about?",
                options: ["...anything...", "...anyone..."],
                correct: 1,
                rationale: "He is asking if a person took his phone. In a question, 'anyone' refers to a person.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Has anyone ever stolen something from you?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 7,
                context: "Gelmy: 'Mijo, go to the store and buy me ___ apple. I don't care which one, just a red one.'",
                question: "Which article should Gelmy use?",
                options: ["...the...", "...an..."],
                correct: 1,
                rationale: "She wants one unspecific apple. Because 'apple' starts with a vowel sound, she must use 'an'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you eat an apple every day?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 8,
                context: "Titó: 'I bought a new car yesterday. Look out the window, ___ car is parked right in front of the house.'",
                question: "Which article should Titó use for the second sentence?",
                options: ["...The...", "...A..."],
                correct: 0,
                rationale: "He already introduced the car in the first sentence. Now it is a specific, known object, so he uses 'The'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Describe the car or motorcycle of your dreams.'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 9,
                context: "El pa: 'Bro, I have a big secret. I need to tell you ___ very important.'",
                question: "What does El pa need to tell?",
                options: ["...somewhere...", "...something..."],
                correct: 1,
                rationale: "He wants to share a piece of information or a fact (a 'thing'). So he says 'something'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Tell me something interesting about your day.'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 10,
                context: "Gelmy: 'I invited the whole family to the party, but ___ came. I am sitting here all alone.'",
                question: "Who came to Gelmy's party?",
                options: ["...no one...", "...anyone..."],
                correct: 0,
                rationale: "Because she is sitting 'all alone', it means zero people arrived. 'No one' is the correct negative pronoun.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Would you be sad if no one came to your birthday party?'"
            },

            // --- LEVEL 2: THE GAME (Chat Interface) ---
            { type: 'transition', level: 2, title: "LEVEL 2: THE GAME", desc: "Real-world texting. The family is dealing with mysteries and needs your help to complete their sentences logically." },

            {
                type: 'q_chat', level: 2, qNum: 11, sender: "El pa 🧢",
                incoming: "Bro, I just got home and the front door is wide open. Do you think there is ___ inside?",
                options: ["...anyone...", "...nothing..."],
                correct: 0,
                rationale: "In a question about a possible intruder, 'anyone' refers to a person.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Would you go inside if the door was open, or call someone?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 12, sender: "Gelmy 👵",
                incoming: "Mijo, I made a delicious soup. I want to give ___ to the neighbors. Can you take it to them?",
                options: ["...any...", "...some..."],
                correct: 1,
                rationale: "When making an offer or giving a positive amount of something, you use 'some'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you ever share some food with your neighbors?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 13, sender: "Titó 🤠",
                incoming: "I am looking for my hat. I looked in the bedroom, the kitchen, and the bathroom. It is ___!",
                options: ["...nowhere...", "...anywhere..."],
                correct: 0,
                rationale: "He checked all the places and it is in zero locations. 'Nowhere' means 'in no place'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Where do you put your keys so they are not nowhere?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 14, sender: "El pa 🧢",
                incoming: "Parce, I need a pen to sign this contract right now. Do you have ___ pen I can borrow?",
                options: ["...the...", "...a..."],
                correct: 1,
                rationale: "He doesn't need a specific pen, just any single pen. So he uses 'a'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you usually carry a pen with you?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 15, sender: "Gelmy 👵",
                incoming: "I bought a dress and a pair of shoes. ___ dress is beautiful, but the shoes hurt my feet.",
                options: ["A", "The"],
                correct: 1,
                rationale: "She already mentioned the dress in the first sentence. Now it is specific, so she uses 'The'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you remember the last piece of clothing you bought?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 16, sender: "Titó 🤠",
                incoming: "My phone is completely dead and I don't have a charger. There is ___ I can do to turn it on.",
                options: ["...anything...", "...nothing..."],
                correct: 1,
                rationale: "The sentence is affirmative ('There is'), but the meaning is zero options. So, 'nothing'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What do you do when there is nothing on your phone?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 17, sender: "El pa 🧢",
                incoming: "Bro, the party is completely empty. The music is playing but ___ is dancing.",
                options: ["...nobody...", "...somebody..."],
                correct: 0,
                rationale: "If the party is completely empty, it means zero people are there. 'Nobody' is correct.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you like to be the first somebody to dance at a party?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 18, sender: "Gelmy 👵",
                incoming: "Mijo, I'm at the supermarket. Do we need ___ milk for the coffee tomorrow?",
                options: ["...some...", "...any..."],
                correct: 1,
                rationale: "In general questions asking if an amount exists, 'any' is the correct word.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you buy any milk when you go to the store?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 19, sender: "Titó 🤠",
                incoming: "I am so bored at home today. Let's go ___ fun tonight. Maybe the cinema or a restaurant.",
                options: ["...somewhere...", "...something..."],
                correct: 0,
                rationale: "He is suggesting going to an unspecified location. 'Somewhere' is a place.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Where is somewhere fun to go in your city?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 20, sender: "El pa 🧢",
                incoming: "Parce, I saw a UFO in the sky last night! But when I pointed, it disappeared. ___ believes me!",
                options: ["...Anyone...", "...No one..."],
                correct: 1,
                rationale: "Because it disappeared and he has no proof, zero people believe him. 'No one' is correct.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you believe in aliens or UFOs?'"
            },

            // --- LEVEL 3: THE CHALLENGE (Free Writing) ---
            { type: 'transition', level: 3, title: "LEVEL 3: THE CHALLENGE", desc: "No options. The family is testing your skills. Type the missing word to prove you understand the unknown." },

            {
                type: 'q_write', level: 3, qNum: 21,
                character: "Titó", title: "THE PERSON",
                prompt: "Hey! If you hear a knock on the door but you don't know who it is, you say: 'There is ______ at the door.'",
                acceptable: "Someone / Somebody",
                rationale: "An unspecified person in a positive statement is 'someone' or 'somebody'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you open the door if someone knocks at 2 AM?'"
            },
            {
                type: 'q_write', level: 3, qNum: 22,
                character: "Gelmy", title: "THE THING",
                prompt: "Mijo, if you have a secret object hidden in your pocket, you say: 'I have ______ in my pocket.'",
                acceptable: "Something",
                rationale: "An unspecified object in a positive statement is 'something'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you have something in your pockets right now?'"
            },
            {
                type: 'q_write', level: 3, qNum: 23,
                character: "El pa", title: "THE PLACE",
                prompt: "Bro, if you want to travel but you don't care which city, you say: 'I want to go ______ new.'",
                acceptable: "Somewhere",
                rationale: "An unspecified location in a positive statement is 'somewhere'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Where is somewhere you really want to visit?'"
            },
            {
                type: 'q_write', level: 3, qNum: 24,
                character: "Titó", title: "THE NEGATIVE THING",
                prompt: "If your wallet is completely empty, you make a negative statement: 'I don't have ______ in my wallet.'",
                acceptable: "Anything",
                rationale: "In a negative sentence ('don't have'), you use 'anything' for objects.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you have anything expensive in your bag?'"
            },
            {
                type: 'q_write', level: 3, qNum: 25,
                character: "Gelmy", title: "THE EMPTY ROOM",
                prompt: "Mijo, if you walk into a room and there are zero people inside, you say: 'There is ______ in the room.'",
                acceptable: "No one / Nobody",
                rationale: "To express zero people in a grammatically positive sentence, use 'no one' or 'nobody'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you like it when nobody is at home?'"
            },
            {
                type: 'q_write', level: 3, qNum: 26,
                character: "El pa", title: "THE QUESTION",
                prompt: "Parce, if you are lost and need help, you ask the crowd: 'Can ______ help me?'",
                acceptable: "Anyone / Anybody",
                rationale: "In a general question asking for a person, use 'anyone' or 'anybody'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Who is anyone you can call in an emergency?'"
            },
            {
                type: 'q_write', level: 3, qNum: 27,
                character: "Titó", title: "THE ARTICLE 1",
                prompt: "If you see a random dog on the street for the first time, you say: 'Look, there is ______ dog.' (Use an article)",
                acceptable: "A / a",
                rationale: "For a singular, non-specific consonant noun mentioned for the first time, use 'a'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you have a pet dog or a cat?'"
            },
            {
                type: 'q_write', level: 3, qNum: 28,
                character: "Gelmy", title: "THE ARTICLE 2",
                prompt: "Mijo, if you are looking at your own dog that you love, you say: 'I need to feed ______ dog.' (Use an article)",
                acceptable: "The / the",
                rationale: "For a specific, known noun, use the definite article 'the'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you feed the street dogs in your neighborhood?'"
            },
            {
                type: 'q_write', level: 3, qNum: 29,
                character: "El pa", title: "THE OFFER",
                prompt: "Bro, if you want to offer your friend a drink politely, you ask: 'Would you like ______ water?'",
                acceptable: "Some",
                rationale: "In questions that are polite offers or requests, use 'some' instead of 'any'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Would you like some coffee right now?'"
            },
            {
                type: 'q_write', level: 3, qNum: 30,
                character: "Titó", title: "THE MYSTERY",
                prompt: "Final question. If a box is locked and empty, you say: 'There is ______ inside the box.'",
                acceptable: "Nothing",
                rationale: "To express zero objects in an affirmative sentence structure ('There is'), use 'nothing'.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Is there nothing you are afraid of?'"
            }
        ];

        let currentSlide = 0;
        let score = 0;
        let answeredQuestions = new Set();
        let selectedAnswers = {};
        let isGradingState = false;
        let freaknReported = false;

        var freaknAnswers = [];
        function registrarRespuesta(id, pregunta, respuesta, acerto, esperada) {
            if (freaknAnswers.some(function (a) { return a.id === id; })) return; // 1er intento
            freaknAnswers.push({ id: id, question: pregunta, answer: respuesta, correct: acerto, expected: esperada });
        }
        function reportarResultado() {
            if (freaknReported) return;
            freaknReported = true;
            FreaknActivity.submit({
                activityId: "lesson-quiz",
                title: document.title,
                score: freaknAnswers.filter(function (a) { return a.correct; }).length,
                maxScore: freaknAnswers.length,
                answers: freaknAnswers
            });
        }

        const appContainer = document.getElementById('slide-mount');

        function renderSlide() {
            const data = lessonData[currentSlide];
            appContainer.innerHTML = '';
            appContainer.className = 'w-full h-full flex slide-enter'; 

            const buildNav = (isAnswered) => `
                <div class="absolute bottom-6 w-full px-12 flex justify-between items-center z-50">
                    <button onclick="nav(-1)" class="btn-freak bg-transparent text-white border-white hover:bg-white hover:text-freakDark shadow-none py-2 px-4 text-sm">PREVIOUS</button>
                    ${isAnswered && data.type !== 'q_write' ? `<button onclick="nav(1)" class="btn-freak bg-freakYellow animate-bounce">NEXT STEP ➔</button>` : ``}
                    ${isAnswered && data.type === 'q_write' && !isGradingState ? `<button onclick="nav(1)" class="btn-freak bg-freakYellow animate-bounce">NEXT STEP ➔</button>` : ``}
                </div>
            `;

            if (data.type === 'intro') {
                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center text-center p-12 bg-freakDark text-white relative h-full">
                        <div class="bg-freakYellow text-freakDark font-mont font-bold tracking-widest uppercase py-3 px-8 mb-8 transform -skew-x-12">
                            <span class="block transform skew-x-12 text-xl">${data.unitModule}</span>
                        </div>
                        <h1 class="title-freak text-[110px] text-freakYellow mb-8 leading-none max-w-4xl">${data.title}</h1>
                        <p class="text-freak text-3xl font-bold mb-16 max-w-4xl leading-relaxed">${data.objective}</p>
                        <div class="border-4 border-white py-3 px-10 mb-12">
                            <span class="font-mont font-black tracking-widest uppercase text-freakBlue text-2xl">${data.bottomTag}</span>
                        </div>
                        <div class="flex gap-6 absolute bottom-12">
                            <button class="btn-freak opacity-50 cursor-not-allowed text-sm py-3 px-6" disabled>PREVIOUS</button>
                            <button onclick="nav(1)" class="btn-freak bg-freakYellow hover:bg-freakBlue text-sm py-3 px-6">NEXT STEP ➔</button>
                        </div>
                    </div>
                `;
            } 
            else if (data.type === 'cheatsheet') {
                let rulesHtml = '';
                data.rules.forEach((rule, idx) => {
                    rulesHtml += `
                        <div class="bg-white p-8 border-4 border-freakDark shadow-[8px_8px_0px_#E4DF33] transform ${idx % 2 === 0 ? '-skew-x-2' : 'skew-x-2'} flex flex-col h-full">
                            <h3 class="font-bree text-2xl text-freakYellow mb-4 bg-freakDark inline-block px-4 py-2 self-start transform skew-x-2">${rule.title}</h3>
                            <p class="font-mont font-bold text-freakDark text-xl mb-6 flex-grow">${rule.desc}</p>
                            <div class="bg-gray-100 p-4 font-mont text-lg font-bold border-l-8 border-freakBlue text-freakDark">
                                ${rule.example}
                            </div>
                        </div>
                    `;
                });

                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center p-12 bg-[#1a1a1a] text-white relative h-full">
                        <div class="absolute top-8 left-8 text-gray-500 font-bree text-2xl">BEFORE WE PLAY...</div>
                        <h2 class="title-freak text-7xl text-freakYellow mb-4 mt-8">${data.title}</h2>
                        <p class="font-mont text-2xl font-bold mb-12 border-b-4 border-freakBlue pb-4 text-gray-300">${data.subtitle}</p>
                        
                        <div class="grid grid-cols-3 gap-8 w-full max-w-6xl">
                            ${rulesHtml}
                        </div>
                        
                        <div class="absolute bottom-8 right-12">
                            <button onclick="nav(1)" class="btn-freak bg-freakYellow hover:bg-freakBlue text-sm py-3 px-6 animate-bounce">GOT IT. LET'S PLAY ➔</button>
                        </div>
                        <div class="absolute bottom-8 left-12">
                            <button onclick="nav(-1)" class="btn-freak bg-transparent text-white border-white hover:bg-white hover:text-freakDark shadow-none py-3 px-6 text-sm">PREVIOUS</button>
                        </div>
                    </div>
                `;
            }
            else if (data.type === 'transition') {
                appContainer.innerHTML = `
                    <div class="w-1/2 h-full bg-freakYellow flex flex-col justify-center p-16">
                        <h1 class="title-freak text-8xl text-freakDark leading-none mb-6">${data.title}</h1>
                    </div>
                    <div class="w-1/2 h-full bg-freakDark flex flex-col justify-center items-start p-16 text-white relative">
                        <p class="text-freak text-3xl font-bold mb-12 border-l-8 border-freakBlue pl-6 leading-relaxed">${data.desc}</p>
                        <div class="absolute bottom-12 flex gap-6">
                            <button onclick="nav(-1)" class="btn-freak bg-transparent border-white text-white hover:bg-white hover:text-freakDark text-sm py-2 px-4">PREVIOUS</button>
                            <button onclick="nav(1)" class="btn-freak bg-freakBlue hover:bg-freakYellow">START LEVEL ➔</button>
                        </div>
                    </div>
                `;
            }
            // LEVEL 1: THE VIBE
            else if (data.type === 'q_vibe') {
                const isAnswered = answeredQuestions.has(currentSlide);
                const selectedOpt = selectedAnswers[currentSlide];

                let optionsHtml = '';
                data.options.forEach((opt, idx) => {
                    let btnClass = "bg-white text-freakDark hover:bg-gray-100 border-4 border-freakDark shadow-[4px_4px_0px_#30302F]";
                    let disabled = isAnswered ? "disabled" : "";
                    
                    if (isAnswered) {
                        if (idx === data.correct) btnClass = "bg-freakBlue text-freakDark border-4 border-freakDark shadow-[4px_4px_0px_#30302F]";
                        else if (idx === selectedOpt && idx !== data.correct) btnClass = "bg-red-400 text-white border-4 border-red-900 shadow-[4px_4px_0px_#7f1d1d] opacity-50";
                        else btnClass = "bg-gray-200 text-gray-500 border-4 border-gray-400 opacity-50";
                    }

                    optionsHtml += `<button ${disabled} onclick="handleAnswer(${idx})" class="text-left font-mont font-bold text-xl p-4 w-full transition-all ${btnClass}">${opt}</button>`;
                });

                let feedbackHtml = isAnswered ? `
                    <div class="mt-8 p-5 bg-gray-50 border-4 border-freakDark shadow-[6px_6px_0px_#30302F] animate-[slideIn_0.3s_ease-out]">
                        <h4 class="font-bree text-2xl mb-1">${selectedOpt === data.correct ? "<span class='text-green-600'>BOOM. CORRECT.</span>" : "<span class='text-red-600'>HOLD UP. INCORRECT.</span>"}</h4>
                        <p class="font-mont text-md font-bold mb-3">${data.rationale}</p>
                        <div class="bg-freakYellow text-freakDark p-3 font-bold font-mont text-sm transform -skew-x-2 border-2 border-freakDark">
                            ${data.teacherPrompt}
                        </div>
                    </div>` : '';

                appContainer.innerHTML = `
                    <div class="w-full h-full flex pb-20">
                        <div class="w-[45%] h-full bg-freakYellow p-12 flex flex-col justify-center relative">
                            <div class="absolute top-6 left-6 text-freakDark font-bree text-xl opacity-50">Q${data.qNum}/30 | THE VIBE</div>
                            <div class="bg-white text-freakDark p-8 border-4 border-freakDark shadow-[8px_8px_0px_#30302F] transform -rotate-1">
                                <p class="text-2xl leading-relaxed font-bree">${data.context}</p>
                            </div>
                        </div>
                        <div class="w-[55%] h-full bg-freakDark p-12 flex flex-col justify-center relative">
                            <h2 class="text-freakBlue font-bree text-3xl mb-6">${data.question}</h2>
                            <div class="flex flex-col gap-4">${optionsHtml}</div>
                            ${feedbackHtml}
                        </div>
                    </div>
                    ${buildNav(isAnswered)}
                `;
            }
            // LEVEL 2: THE GAME (Chat Interface)
            else if (data.type === 'q_chat') {
                const isAnswered = answeredQuestions.has(currentSlide);
                const selectedOpt = selectedAnswers[currentSlide];

                let optionsHtml = '';
                if (!isAnswered) {
                    data.options.forEach((opt, idx) => {
                        optionsHtml += `
                            <button onclick="handleAnswer(${idx})" class="w-full text-right bg-freakBlue text-freakDark font-mont font-bold text-sm p-4 rounded-2xl rounded-br-none border-2 border-freakDark hover:bg-freakYellow transition-all mb-3 shadow-[4px_4px_0px_#30302F]">
                                ${opt}
                            </button>
                        `;
                    });
                } else {
                    const isCorrect = selectedOpt === data.correct;
                    const bubbleColor = isCorrect ? 'bg-green-400' : 'bg-red-400';
                    optionsHtml = `
                        <div class="w-[85%] self-end text-right ${bubbleColor} text-freakDark font-mont font-bold text-sm p-4 rounded-2xl rounded-br-none border-2 border-freakDark shadow-[4px_4px_0px_#30302F] mb-3">
                            ${data.options[selectedOpt]}
                        </div>
                        <div class="text-right text-xs text-gray-500 font-mont italic pr-2">Read</div>
                    `;
                }

                let feedbackHtml = isAnswered ? `
                    <div class="bg-freakDark border-4 border-freakYellow p-6 text-white shadow-[8px_8px_0px_#E4DF33] animate-[slideIn_0.3s_ease-out]">
                        <h4 class="font-bree text-2xl mb-2 text-freakYellow">${selectedOpt === data.correct ? "STREET SMART." : "AWKWARD TEXT."}</h4>
                        <p class="font-mont text-md font-bold mb-4">${data.rationale}</p>
                        <div class="bg-freakYellow text-freakDark p-3 font-bold font-mont text-sm transform -skew-x-2">
                            ${data.teacherPrompt}
                        </div>
                    </div>` : `
                    <div class="h-full flex flex-col justify-center">
                        <h2 class="font-bree text-5xl text-freakYellow mb-4">YOUR TURN</h2>
                        <p class="font-mont text-xl text-white leading-relaxed">Read the incoming message. Choose the best reply to handle the situation.</p>
                    </div>`;

                appContainer.innerHTML = `
                    <div class="w-full h-full bg-[#1a1a1a] flex items-center justify-center gap-12 p-8 relative pb-20">
                        <div class="absolute top-6 left-6 text-white font-bree text-xl opacity-50">Q${data.qNum}/30 | THE GAME</div>
                        
                        <!-- Phone UI -->
                        <div class="w-[380px] h-[550px] bg-white rounded-[3rem] border-[12px] border-gray-800 p-4 flex flex-col relative shadow-2xl flex-shrink-0">
                            <!-- Notch -->
                            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-6 bg-gray-800 rounded-b-2xl"></div>
                            
                            <!-- Header -->
                            <div class="text-center font-bold font-mont border-b-2 border-gray-200 pb-3 mt-4 mb-4 text-freakDark">
                                ${data.sender}
                            </div>
                            
                            <!-- Chat Area -->
                            <div class="flex-1 overflow-y-auto flex flex-col pr-2">
                                <!-- Incoming -->
                                <div class="w-[85%] bg-gray-200 text-freakDark font-mont font-medium text-sm p-4 rounded-2xl rounded-bl-none mb-6">
                                    ${data.incoming}
                                </div>
                                
                                <!-- Options / Sent -->
                                <div class="mt-auto flex flex-col items-end w-full">
                                    ${optionsHtml}
                                </div>
                            </div>
                        </div>

                        <div class="w-[500px]">
                            ${feedbackHtml}
                        </div>
                    </div>
                    ${buildNav(isAnswered)}
                `;
            }
            // LEVEL 3: THE CHALLENGE (Unstructured Text Input)
            else if (data.type === 'q_write') {
                const isAnswered = answeredQuestions.has(currentSlide);
                
                let contentHtml = '';

                if (!isGradingState && !isAnswered) {
                    // State 1: Input
                    contentHtml = `
                        <div class="bg-white p-8 border-4 border-freakDark shadow-[8px_8px_0px_#E4DF33] relative mb-8">
                            <div class="absolute -top-5 -left-5 bg-freakBlue text-freakDark font-bree text-xl px-4 py-1 border-4 border-freakDark transform -rotate-3">${data.character}</div>
                            <p class="font-mont text-2xl font-bold text-freakDark mb-6">${data.prompt}</p>
                            <input type="text" id="write-input" placeholder="Type your answer here..." autocomplete="off"
                                class="w-full bg-gray-100 border-4 border-gray-300 text-freakDark p-4 font-mont text-2xl font-bold outline-none focus:border-freakBlue transition-all">
                        </div>
                        <div class="flex justify-end">
                            <button onclick="submitWriting()" class="btn-freak bg-freakYellow hover:bg-freakBlue text-xl py-4 px-8">REVEAL ANSWER ➔</button>
                        </div>
                    `;
                } else if (isGradingState) {
                    // State 2: Self-Grading (Teacher Check)
                    const userText = selectedAnswers[currentSlide];
                    contentHtml = `
                        <div class="flex gap-6 mb-6 animate-[slideIn_0.3s_ease-out]">
                            <!-- Left: User Answer -->
                            <div class="w-1/2 bg-gray-800 border-4 border-gray-600 p-6 shadow-[6px_6px_0px_#30302F]">
                                <h4 class="font-bree text-freakYellow text-xl mb-4">YOU WROTE:</h4>
                                <p class="font-mont text-white text-2xl font-bold italic">"${userText}"</p>
                            </div>
                            <!-- Right: Expected Answer -->
                            <div class="w-1/2 bg-white border-4 border-freakDark p-6 shadow-[6px_6px_0px_#93E5FF]">
                                <h4 class="font-bree text-freakBlue text-xl mb-4">FREAKN' ACCEPTABLE ANSWERS:</h4>
                                <p class="font-mont text-freakDark text-2xl font-bold">${data.acceptable}</p>
                                <p class="font-mont text-gray-500 text-sm mt-3 border-t-2 border-gray-200 pt-2">${data.rationale}</p>
                            </div>
                        </div>
                        
                        <!-- Teacher Prompt inside grading -->
                        <div class="w-full bg-freakBlue border-4 border-freakDark p-3 mb-6 transform -skew-x-2 shadow-[4px_4px_0px_#30302F]">
                            <p class="font-mont font-bold text-freakDark text-center">${data.teacherPrompt}</p>
                        </div>

                        <!-- Self-Grade Decision -->
                        <div class="bg-freakDark border-4 border-freakYellow p-4 text-center transform skew-x-2">
                            <h3 class="font-bree text-freakYellow text-2xl mb-2">THE VIBE CHECK</h3>
                            <p class="font-mont text-white text-md mb-4">Be honest. Did your answer capture the right vocabulary?</p>
                            <div class="flex justify-center gap-6">
                                <button onclick="selfGrade(false)" class="btn-freak bg-red-400 text-white border-red-900 shadow-[4px_4px_0px_#7f1d1d] hover:bg-red-500 py-2 px-4 text-sm">I MESSED UP</button>
                                <button onclick="selfGrade(true)" class="btn-freak bg-green-400 text-freakDark border-green-900 shadow-[4px_4px_0px_#14532d] hover:bg-green-500 py-2 px-4 text-sm">I GOT IT (+1 PT)</button>
                            </div>
                        </div>
                    `;
                } else if (isAnswered) {
                    // State 3: Reviewed
                    const userText = selectedAnswers[currentSlide];
                    contentHtml = `
                         <div class="bg-gray-800 border-4 border-gray-600 p-6 shadow-[6px_6px_0px_#30302F] opacity-50 mb-8">
                            <h4 class="font-bree text-gray-400 text-xl mb-2">YOU WROTE:</h4>
                            <p class="font-mont text-gray-300 text-2xl font-bold">"${userText}"</p>
                        </div>
                        <div class="text-center font-mont text-freakYellow font-bold text-xl">Answer recorded. Move to the next step.</div>
                    `;
                }

                appContainer.innerHTML = `
                    <div class="w-full h-full bg-[#111] flex flex-col justify-center items-center relative p-8 pb-20">
                        <div class="absolute top-6 left-6 text-gray-600 font-bree text-xl">Q${data.qNum}/30 | THE CHALLENGE</div>
                        
                        <div class="w-full max-w-4xl">
                            <h2 class="text-freakBlue font-bree text-4xl mb-2 text-center uppercase">${data.title}</h2>
                            <p class="text-gray-400 font-mont text-md mb-6 text-center">Read the prompt and type your answer. You are your own coach.</p>
                            
                            ${contentHtml}
                        </div>
                    </div>
                    ${buildNav(isAnswered && !isGradingState)}
                `;
                
                const inputEl = document.getElementById('write-input');
                if(inputEl) inputEl.focus();
            }
            // OUTRO
            else if (data.type === 'outro') {
                reportarResultado();
                const percentage = Math.round((score / 30) * 100);
                let message = "";
                if (percentage >= 90) message = "ABSOLUTE LEGEND. You own this vocabulary.";
                else if (percentage >= 70) message = "SOLID WORK. You survived the streets.";
                else message = "WE NEED TO TALK. Time to review the basics.";

                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center text-center p-12 bg-freakYellow text-freakDark relative h-full">
                        <h1 class="title-freak text-8xl mb-4">LESSON COMPLETE</h1>
                        <div class="bg-freakDark text-white p-12 mt-8 border-8 border-white shadow-[12px_12px_0px_#30302F] transform skew-y-2">
                            <h2 class="font-bree text-4xl mb-4">YOUR SCORE</h2>
                            <p class="font-mont text-7xl font-black text-freakBlue mb-4">${score} / 30</p>
                            <p class="font-mont text-2xl font-bold">${message}</p>
                        </div>
                        <div class="mt-16 flex gap-6">
                            <button onclick="location.reload()" class="btn-freak bg-white hover:bg-freakBlue">RESTART LESSON</button>
                        </div>
                    </div>
                `;
            }
        }

        window.handleAnswer = function(optIndex) {
            const data = lessonData[currentSlide];
            if (answeredQuestions.has(currentSlide)) return;

            selectedAnswers[currentSlide] = optIndex;
            answeredQuestions.add(currentSlide);

            if (optIndex === data.correct) score++;

            registrarRespuesta(
                'q' + data.qNum,
                data.question || data.incoming,
                data.options[optIndex],
                optIndex === data.correct,
                data.options[data.correct]
            );

            renderSlide();
        }

        window.submitWriting = function() {
            const inputEl = document.getElementById('write-input');
            const userText = inputEl ? inputEl.value.trim() : "";
            if (!userText) {
                inputEl.classList.add('border-red-500');
                return; 
            }
            selectedAnswers[currentSlide] = userText;
            isGradingState = true;
            renderSlide();
        }

        window.selfGrade = function(isCorrect) {
            const data = lessonData[currentSlide];
            isGradingState = false;
            answeredQuestions.add(currentSlide);
            if (isCorrect) score++;

            registrarRespuesta(
                'q' + data.qNum,
                data.prompt,
                selectedAnswers[currentSlide],
                isCorrect,
                data.acceptable
            );

            nav(1);
        }

        window.nav = function(dir) {
            let nextSlide = currentSlide + dir;
            if (nextSlide >= 0 && nextSlide < lessonData.length) {
                currentSlide = nextSlide;
                renderSlide();
            } else if (nextSlide >= lessonData.length) {
                lessonData.push({type: 'outro'});
                currentSlide = lessonData.length -1;
                renderSlide();
            }
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && lessonData[currentSlide]?.type === 'q_write' && !isGradingState && !answeredQuestions.has(currentSlide)) {
                submitWriting();
            }
        });

        renderSlide();
    </script>

    <script>
      /* FREAKN ACTIVITY API v1 — puente con la plataforma.
         Si el HTML se abre fuera de la app, no hace nada (no rompe). */
      window.FreaknActivity = (function () {
        function post(type, payload) {
          try { parent.postMessage({ source: "freakn-lesson", type: type, payload: payload }, "*"); }
          catch (e) {}
        }
        return {
          /** Reporta el resultado de una actividad calificable. */
          submit: function (r) {
            post("freakn:activity:result", {
              activityId: r.activityId,          // id estable dentro del archivo
              title: r.title || document.title,  // nombre legible
              score: r.score,                    // puntos obtenidos
              maxScore: r.maxScore,              // puntaje máximo
              answers: r.answers || []           // ver formato abajo
            });
          },
          /** Marca la lección como vista/terminada (sin puntaje). */
          complete: function () { post("freakn:lesson:complete", {}); }
        };
      })();
    </script>
</body>
</html>
