# Local dev companions for Nest. The Nest process itself runs on the host
# (faster iteration). Bring up Postgres + Redis with:
#   docker compose up -d
# Then in another terminal:
#   bun install && bun run prisma:migrate && bun run prisma:seed && bun run dev
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freakn
    ports: ["5432:5432"]
    volumes:
      - freakn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - freakn_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freakn_pg:
  freakn_redis:
