<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 31: Doctor's Advice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        freakYellow: '#E4DF33',
                        freakDark: '#30302F',
                        freakBlue: '#93E5FF',
                        freakBg: '#111111'
                    },
                    fontFamily: {
                        bree: ['"Bree Serif"', 'serif'],
                        mont: ['Montserrat', 'sans-serif']
                    }
                }
            }

    </script>
    <style>
        body { background-color: #111111; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #app-container { width: 1280px; height: 720px; position: relative; background-color: #30302F; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        .title-freak { font-family: 'Bree Serif', serif; font-weight: 400; text-transform: uppercase; }
        .text-freak { font-family: 'Montserrat', sans-serif; }
        
        .btn-freak {
            background-color: #93E5FF; color: #30302F; font-family: 'Montserrat', sans-serif; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.05em; padding: 1rem 2rem; border: none;
            transition: all 0.2s ease; cursor: pointer; display: inline-block;
        }
        .btn-freak:hover { background-color: #E4DF33; transform: scale(1.05); }
        .btn-freak:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background-color: #ccc; color: #666; }
        
        .slide-enter { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #30302F; }
        ::-webkit-scrollbar-thumb { background: #E4DF33; }

        /* ============ RESPONSIVE (mobile 360-820px) ============ */
        @media (max-width: 820px) {
            body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100vh; }
            #app-container { width: 100%; height: auto; min-height: 100vh; box-shadow: none; }
            #slide-mount { height: auto; min-height: 100vh; flex-direction: column; }
            #slide-mount .h-full { height: auto; }
            .grid-cols-3, .grid-cols-2 { grid-template-columns: 1fr; }
            .w-1\/2, .w-1\/3 { width: 100%; }
            [class*="w-[650px]"], [class*="w-[600px]"] { width: 100%; max-width: 100%; }
            [class*="min-h-[350px]"] { min-height: auto; }
            [class*="gap-6 mb-8"] { flex-direction: column; }
            [class*="shadow-[8px_8px_0px_#30302F]"] { flex-direction: column; align-items: stretch; }
            [class*="shadow-[8px_8px_0px_#30302F]"] .border-r-4 { border-right: 0; border-bottom: 4px solid #30302F; padding-right: 0; padding-bottom: 0.75rem; margin-bottom: 0.75rem; }
            [class*="shadow-[8px_8px_0px_#30302F]"] .w-1\/3 { width: 100%; padding-left: 0; }
            [class*="justify-center mt-auto pb-4"] { flex-wrap: wrap; }
            .rounded-full.px-10.py-4 { padding: 0.6rem 1rem; font-size: 1rem; }
            [class*="text-[110px]"] { font-size: 2.25rem; }
            [class*="text-[120px]"] { font-size: 2.25rem; }
            [class*="text-[100px]"] { font-size: 2.5rem; }
            [class*="text-[60px]"] { font-size: 1.75rem; }
            [class*="text-[50px]"] { font-size: 1.5rem; }
            [class*="text-[40px]"] { font-size: 1.5rem; }
            [class*="text-[38px]"] { font-size: 1.125rem; }
            .text-7xl { font-size: 2rem; }
            .text-5xl { font-size: 1.5rem; }
            .text-4xl { font-size: 1.25rem; }
            .text-3xl { font-size: 1.25rem; }
            .text-2xl { font-size: 1.125rem; }
            .p-20, .p-16, .p-12, .p-10, .p-8 { padding: 1rem; }
            .px-12, .px-10 { padding-left: 1rem; padding-right: 1rem; }
            .gap-10, .gap-8 { gap: 0.75rem; }
            .gap-6 { gap: 0.5rem; }
            .absolute.top-8 { top: 0.5rem; }
            .absolute.bottom-8 { bottom: 0.5rem; }
            .absolute.bottom-6 { bottom: 0.5rem; }
            .absolute.bottom-20 { position: static; margin-top: 1rem; }
            .left-12, .left-8 { left: 0.5rem; }
            .right-12, .right-8 { right: 0.5rem; }
            .-rotate-1 { transform: none; }
            .btn-freak { min-height: 44px; font-size: 16px; padding: 0.75rem 1.25rem; }
            #diagnose-input { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Global Score overlay (hidden on Intro/Outro) -->
        <div id="global-score" class="absolute top-8 right-8 text-freakYellow font-mont font-black text-4xl z-50 hidden">SCORE: 0/30</div>

        <div id="slide-mount" class="w-full h-full flex slide-enter"></div>
    </div>

    <script>
      /* FREAKN ACTIVITY API v1 — puente con la plataforma.
         Si el HTML se abre fuera de la app, no hace nada (no rompe). */
      window.FreaknActivity = (function () {
        function post(type, payload) {
          try { parent.postMessage({ source: "freakn-lesson", type: type, payload: payload }, "*"); }
          catch (e) {}
        }
        return {
          /** Reporta el resultado de una actividad calificable. */
          submit: function (r) {
            post("freakn:activity:result", {
              activityId: r.activityId,          // id estable dentro del archivo
              title: r.title || document.title,  // nombre legible
              score: r.score,                    // puntos obtenidos
              maxScore: r.maxScore,              // puntaje máximo
              answers: r.answers || []           // ver formato abajo
            });
          },
          /** Marca la lección como vista/terminada (sin puntaje). */
          complete: function () { post("freakn:lesson:complete", {}); }
        };
      })();
    </script>

    <script>
        const lessonData = [
            // SLIDE 0: INTRO
            {
                type: 'intro',
                unitModule: "UNIT 7 • MODULE 31",
                title: "DOCTOR'S ADVICE",
                objective: "Learn the difference between suggestions and obligations, talk about health, and give convincing advice like Gelmy!",
                bottomTag: "THE LOGIC OF LIFE • PART 1"
            },
            
            // --- THE VIBE (GRAMMAR BASE) ---
            {
                type: 'cheatsheet',
                title: "THE WAITING ROOM",
                subtitle: "Gelmy and Titó are at the clinic. Listen to the rules.",
                rules: [
                    { title: "THE SUGGESTION", desc: "SHOULD = It's a good idea. Advice.", example: "Doctor: 'You should drink more water, Titó.'" },
                    { title: "THE OBLIGATION", desc: "MUST = It is a rule. You have no choice.", example: "Doctor: 'You must take this pill every 8 hours.'" },
                    { title: "THE NEGATIVES", desc: "SHOULDN'T = Bad idea.<br>MUSTN'T = Forbidden/Dangerous.", example: "Gelmy: 'You mustn't eat chicharrón today!'" }
                ]
            },

            // --- LEVEL 1: THE RECOGNITION (New "Cooler" Design) ---
            { type: 'transition', level: 1, title: "LEVEL 1", subtitle: "THE RECOGNITION", desc: "Is the sentence just a friendly piece of advice, or is it a strict rule you have to follow? Read the quote and decide." },
            
            { qType: 'recognize', level: 1, qNum: 1, q: "You should drink more water.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 0, rationale: "Drinking water is a great idea for health, but it's advice, not a strict law.", teacherPrompt: "👉 TEACHER: Ask the student: How many glasses of water should you drink daily?" },
            { qType: 'recognize', level: 1, qNum: 2, q: "You must stop at a red light.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 1, rationale: "This is a strict traffic law. If you don't do it, there are bad consequences.", teacherPrompt: "👉 TEACHER: Ask the student: What happens if you don't stop?" },
            { qType: 'recognize', level: 1, qNum: 3, q: "He should call his mother.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 0, rationale: "Gelmy would say this is an obligation, but grammatically, 'should' is just strong advice.", teacherPrompt: "👉 TEACHER: Ask the student: How often should you call your parents?" },
            { qType: 'recognize', level: 1, qNum: 4, q: "Students must wear a uniform.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 1, rationale: "This is an official school rule. They have no choice.", teacherPrompt: "👉 TEACHER: Ask the student: Did you have to wear a uniform in school? Did you like it?" },
            { qType: 'recognize', level: 1, qNum: 5, q: "You should wear a jacket, it's cold.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 0, rationale: "It's a recommendation to stay warm, but no one will arrest you if you don't.", teacherPrompt: "👉 TEACHER: Ask the student: What should you wear in Medellin today?" },
            { qType: 'recognize', level: 1, qNum: 6, q: "Drivers must have a license.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 1, rationale: "It's illegal to drive without one. It is an absolute obligation.", teacherPrompt: "👉 TEACHER: Ask the student: At what age can you get a license here?" },
            { qType: 'recognize', level: 1, qNum: 7, q: "You should try the buñuelos.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 0, rationale: "It's a delicious food recommendation, not a law.", teacherPrompt: "👉 TEACHER: Ask the student: What is a local food a tourist should try?" },
            { qType: 'recognize', level: 1, qNum: 8, q: "You must pay your taxes.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 1, rationale: "The government requires this. It is a strict rule.", teacherPrompt: "👉 TEACHER: Ask the student: Is paying taxes complicated in your country?" },
            { qType: 'recognize', level: 1, qNum: 9, q: "She should sleep 8 hours.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 0, rationale: "It's a healthy habit, not an enforced rule.", teacherPrompt: "👉 TEACHER: Ask the student: How many hours do you usually sleep?" },
            { qType: 'recognize', level: 1, qNum: 10, q: "Employees must arrive on time.", options: ["A) Advice (It's a suggestion)", "B) Rule (It's an obligation)"], correct: 1, rationale: "This is a company policy/rule. You can lose your job if you don't.", teacherPrompt: "👉 TEACHER: Ask the student: Are people in your city usually on time?" },

            // --- LEVEL 2: THE PRESCRIPTION (Medical Pad UI) ---
            { type: 'transition', level: 2, title: "LEVEL 2", subtitle: "THE PRESCRIPTION", desc: "You are the doctor's assistant. Read the patient's chart and select the correct medical advice or rule to complete the prescription." },

            { qType: 'prescription', level: 2, qNum: 11, patient: "Titó", context: "Patient has a fever. He ___ stay in bed.", options: ["should", "mustn't"], correct: 0, rationale: "Resting is a strong medical recommendation (advice).", teacherPrompt: "👉 TEACHER: What else should you do when you have a fever?" },
            { qType: 'prescription', level: 2, qNum: 12, patient: "El pa", context: "Emergency room! Your arm is broken. You ___ see a doctor immediately.", options: ["shouldn't", "must"], correct: 1, rationale: "For a broken bone, it's not just a good idea, it's an absolute necessity/obligation.", teacherPrompt: "👉 TEACHER: Have you ever broken a bone?" },
            { qType: 'prescription', level: 2, qNum: 13, patient: "Gelmy", context: "Your teeth hurt a little. You ___ visit the dentist soon.", options: ["should", "mustn't"], correct: 0, rationale: "It's a good idea to prevent worse pain. It's advice.", teacherPrompt: "👉 TEACHER: Do you like going to the dentist?" },
            { qType: 'prescription', level: 2, qNum: 14, patient: "Titó", context: "Titó has very high blood pressure. He ___ eat extra salt.", options: ["shouldn't", "must"], correct: 0, rationale: "It's a strong negative recommendation for his health.", teacherPrompt: "👉 TEACHER: Do you eat a lot of salty food?" },
            { qType: 'prescription', level: 2, qNum: 15, patient: "Surgeon", context: "To enter the surgery room, you ___ wash your hands and wear a mask.", options: ["should", "must"], correct: 1, rationale: "This is a strict hospital protocol and rule. No exceptions.", teacherPrompt: "👉 TEACHER: What happens if doctors don't follow this rule?" },
            { qType: 'prescription', level: 2, qNum: 16, patient: "El pa", context: "I'm feeling very tired from studying. I ___ take a short nap.", options: ["should", "must"], correct: 0, rationale: "It's a personal suggestion to feel better.", teacherPrompt: "👉 TEACHER: Do you take naps during the day?" },
            { qType: 'prescription', level: 2, qNum: 17, patient: "Visitor", context: "You ___ smoke inside the hospital. It's totally forbidden!", options: ["shouldn't", "mustn't"], correct: 1, rationale: "When something is forbidden by law or rule, we use 'mustn't'.", teacherPrompt: "👉 TEACHER: Where else is smoking usually forbidden?" },
            { qType: 'prescription', level: 2, qNum: 18, patient: "Gelmy", context: "The medicine makes you sleepy. You ___ drive your car after taking it.", options: ["shouldn't", "must"], correct: 0, rationale: "It's a strong warning and bad idea to drive.", teacherPrompt: "👉 TEACHER: Is driving in your city difficult?" },
            { qType: 'prescription', level: 2, qNum: 19, patient: "El pa", context: "He wants to learn English fast. He ___ practice every single day.", options: ["should", "mustn't"], correct: 0, rationale: "It's the best advice for learning, but not a legal obligation.", teacherPrompt: "👉 TEACHER: What else should he do to learn English?" },
            { qType: 'prescription', level: 2, qNum: 20, patient: "Nurse", context: "This is a secret medical file. You ___ show it to the public.", options: ["shouldn't", "mustn't"], correct: 1, rationale: "It is illegal (a broken rule) to share private medical data.", teacherPrompt: "👉 TEACHER: Why is medical privacy important?" },

            // --- LEVEL 3: THE CLINIC (Open Text, Patient Files UI) ---
            { type: 'transition', level: 3, title: "LEVEL 3", subtitle: "THE CLINIC", desc: "You are the doctor now. Read the patient's problem and type your own advice (should) or rule (must)." },

            { qType: 'diagnose', level: 3, qNum: 21, issue: "Patient wants to lose weight.", prompt: "Give the patient one piece of advice using 'SHOULD'.", acceptable: "You should eat more vegetables / You should exercise.", teacherPrompt: "👉 TEACHER: Ask: What is the worst advice for this patient?" },
            { qType: 'diagnose', level: 3, qNum: 22, issue: "Patient is inside a quiet library.", prompt: "Tell the patient one rule they have to follow using 'MUST'.", acceptable: "You must be quiet / You must turn off your phone.", teacherPrompt: "👉 TEACHER: Ask: Have you ever been kicked out of a place for breaking a rule?" },
            { qType: 'diagnose', level: 3, qNum: 23, issue: "Titó wants to speak English like a native.", prompt: "Give Titó a strong suggestion using 'SHOULD'.", acceptable: "You should watch movies in English / You should talk to foreigners.", teacherPrompt: "👉 TEACHER: Ask: What is your favorite way to practice English?" },
            { qType: 'diagnose', level: 3, qNum: 24, issue: "The patient's phone battery is at 1%.", prompt: "Give them urgent advice using 'SHOULD'.", acceptable: "You should charge it / You should find a charger.", teacherPrompt: "👉 TEACHER: Ask: Do you panic when your phone is at 1%?" },
            { qType: 'diagnose', level: 3, qNum: 25, issue: "The patient is boarding an airplane.", prompt: "State an airline safety rule using 'MUST'.", acceptable: "You must fasten your seatbelt / You must sit down.", teacherPrompt: "👉 TEACHER: Ask: Do you like flying?" },
            { qType: 'diagnose', level: 3, qNum: 26, issue: "Gelmy thinks El pa is dressing too casually for an interview.", prompt: "What advice does Gelmy give him using 'SHOULD'?", acceptable: "You should wear a tie / You should look elegant.", teacherPrompt: "👉 TEACHER: Ask: What do you normally wear to an interview?" },
            { qType: 'diagnose', level: 3, qNum: 27, issue: "The patient has a terrible headache.", prompt: "What is a bad idea? Use 'SHOULDN'T'.", acceptable: "You shouldn't look at your phone / You shouldn't listen to loud music.", teacherPrompt: "👉 TEACHER: Ask: What is your personal cure for a headache?" },
            { qType: 'diagnose', level: 3, qNum: 28, issue: "A tourist wants to visit Medellin.", prompt: "Give them a top recommendation using 'SHOULD'.", acceptable: "You should visit Guatape / You should eat a Bandeja Paisa.", teacherPrompt: "👉 TEACHER: Ask: Where should a tourist go in YOUR city?" },
            { qType: 'diagnose', level: 3, qNum: 29, issue: "The patient wants to pass the final exam.", prompt: "What is the absolute requirement? Use 'MUST'.", acceptable: "You must study hard / You must take notes.", teacherPrompt: "👉 TEACHER: Ask: Are you a good test-taker?" },
            { qType: 'diagnose', level: 3, qNum: 30, issue: "Titó is very angry right now.", prompt: "What is something he needs to avoid doing? Use 'SHOULDN'T'.", acceptable: "You shouldn't shout / You shouldn't make decisions now.", teacherPrompt: "👉 TEACHER: Ask: What should people do when they are angry to calm down?" }
        ];

        let currentSlide = 0;
        let score = 0;
        let answeredQuestions = new Set();
        let selectedAnswers = {};
        let isGradingState = false;
        let writeGrades = {}; // Level 3 self-grade results, keyed by slide index

        function buildFreaknAnswers() {
            const answers = [];
            lessonData.forEach(function (item, i) {
                if (!answeredQuestions.has(i)) return;
                if (item.qType === 'recognize') {
                    const sel = selectedAnswers[i];
                    answers.push({
                        id: 'q' + item.qNum,
                        question: item.q,
                        answer: item.options[sel],
                        correct: sel === item.correct,
                        expected: item.options[item.correct]
                    });
                } else if (item.qType === 'prescription') {
                    const sel = selectedAnswers[i];
                    answers.push({
                        id: 'q' + item.qNum,
                        question: item.context,
                        answer: item.options[sel],
                        correct: sel === item.correct,
                        expected: item.options[item.correct]
                    });
                } else if (item.qType === 'diagnose') {
                    answers.push({
                        id: 'q' + item.qNum,
                        question: item.prompt,
                        answer: selectedAnswers[i],
                        correct: !!writeGrades[i],
                        expected: item.acceptable
                    });
                }
            });
            return answers;
        }

        const appContainer = document.getElementById('slide-mount');
        const scoreDisplay = document.getElementById('global-score');

        function renderSlide() {
            const data = lessonData[currentSlide];
            appContainer.innerHTML = '';
            appContainer.className = 'w-full h-full flex slide-enter'; 

            // Show/hide global score
            if (['intro', 'cheatsheet', 'outro', 'transition'].includes(data.type)) {
                scoreDisplay.classList.add('hidden');
            } else {
                scoreDisplay.classList.remove('hidden');
                scoreDisplay.innerText = `SCORE: ${score}/30`;
            }

            const buildNav = (isAnswered) => `
                <div class="absolute bottom-6 w-full px-12 flex justify-between items-center z-40">
                    <button onclick="nav(-1)" class="btn-freak bg-transparent text-white border-2 border-white hover:bg-white hover:text-freakDark text-sm py-2 px-6 shadow-none">PREVIOUS</button>
                    ${isAnswered && data.qType !== 'diagnose' ? `<button onclick="nav(1)" class="btn-freak bg-freakYellow text-freakDark py-2 px-6 shadow-[4px_4px_0px_#111] animate-bounce">NEXT STEP ➔</button>` : ``}
                    ${isAnswered && data.qType === 'diagnose' && !isGradingState ? `<button onclick="nav(1)" class="btn-freak bg-freakYellow text-freakDark py-2 px-6 shadow-[4px_4px_0px_#111] animate-bounce">NEXT STEP ➔</button>` : ``}
                </div>
            `;

            // SLIDE: INTRO
            if (data.type === 'intro') {
                appContainer.innerHTML = `
                    <div class="w-full flex flex-col items-center justify-center text-center p-12 relative h-full">
                        <div class="inline-block bg-freakYellow text-freakDark font-mont font-black uppercase text-xl px-10 py-2 transform -skew-x-12 mb-6 mt-10">
                            <span class="block transform skew-x-12">${data.unitModule}</span>
                        </div>
                        <h1 class="title-freak text-[110px] text-freakYellow mb-8 leading-none">${data.title}</h1>
                        <p class="text-white font-mont font-bold text-3xl max-w-5xl leading-relaxed mb-12">${data.objective}</p>
                        <div class="border-4 border-white px-12 py-4 mb-16 inline-block">
                            <span class="text-freakBlue font-mont font-black text-3xl uppercase tracking-widest">${data.bottomTag}</span>
                        </div>
                        <div class="flex gap-6 mt-8">
                            <button class="bg-[#888] text-freakDark font-mont font-black uppercase px-10 py-3 opacity-70 cursor-not-allowed">PREVIOUS</button>
                            <button class="bg-freakYellow text-freakDark font-mont font-black uppercase px-10 py-3 hover:scale-105 transition-transform cursor-pointer shadow-[6px_6px_0px_#111]" onclick="nav(1)">NEXT STEP ➔</button>
                        </div>
                    </div>
                `;
            } 
            // SLIDE: CHEATSHEET
            else if (data.type === 'cheatsheet') {
                let rulesHtml = '';
                data.rules.forEach((rule, idx) => {
                    rulesHtml += `
                        <div class="bg-[#222] p-8 border-l-8 border-freakBlue flex flex-col h-full shadow-lg">
                            <h3 class="font-bree text-3xl text-freakYellow mb-4">${rule.title}</h3>
                            <p class="font-mont font-bold text-white text-xl mb-6 flex-grow">${rule.desc}</p>
                            <div class="bg-black p-4 font-mont text-lg font-medium text-gray-300 italic border-l-4 border-freakYellow">
                                ${rule.example}
                            </div>
                        </div>
                    `;
                });

                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center p-12 bg-freakDark text-white relative h-full">
                        <h2 class="title-freak text-7xl text-white mb-2">${data.title}</h2>
                        <p class="font-mont text-2xl font-bold mb-12 text-freakBlue">${data.subtitle}</p>
                        
                        <div class="grid grid-cols-3 gap-8 w-full max-w-6xl">
                            ${rulesHtml}
                        </div>
                        
                        <div class="absolute bottom-8 right-12">
                            <button onclick="nav(1)" class="btn-freak bg-freakYellow hover:bg-white text-sm py-3 px-6 animate-bounce shadow-[4px_4px_0px_#111]">START LEVEL 1 ➔</button>
                        </div>
                        <div class="absolute bottom-8 left-12">
                            <button onclick="nav(-1)" class="btn-freak bg-transparent text-white border-2 border-white hover:bg-white hover:text-freakDark shadow-none py-3 px-6 text-sm">PREVIOUS</button>
                        </div>
                    </div>
                `;
            }
            // SLIDE: TRANSITION
            else if (data.type === 'transition') {
                appContainer.innerHTML = `
                    <div class="w-1/2 h-full bg-freakYellow flex flex-col justify-center p-16 relative overflow-hidden">
                        <div class="text-freakDark font-mont font-black italic text-[40px] mb-4 tracking-tight">${data.title}</div>
                        <h1 class="font-mont font-black text-[60px] leading-[1] text-white uppercase tracking-tight">${data.subtitle.replace(' ', '<br>')}</h1>
                    </div>
                    <div class="w-1/2 h-full bg-freakDark flex flex-col justify-center items-start p-20 text-white relative">
                        <div class="border-l-[8px] border-freakBlue pl-8 mb-12">
                            <p class="font-mont text-[38px] font-bold leading-[1.3] tracking-tight">${data.desc}</p>
                        </div>
                        <div class="absolute bottom-20 flex items-center gap-10 pl-8">
                            <button onclick="nav(-1)" class="font-mont font-black text-white text-xl uppercase tracking-wider hover:text-gray-300 transition-colors">PREVIOUS</button>
                            <button onclick="nav(1)" class="bg-freakBlue text-freakDark font-mont font-black text-xl uppercase tracking-wider py-4 px-8 hover:bg-white transition-colors">BEGIN ➔</button>
                        </div>
                    </div>
                `;
            }
            // LEVEL 1: RECOGNIZE (New Centered/Card Design)
            else if (data.qType === 'recognize') {
                const isAnswered = answeredQuestions.has(currentSlide);
                const selectedOpt = selectedAnswers[currentSlide];

                let optionsHtml = '';
                data.options.forEach((opt, idx) => {
                    let btnClass = "bg-[#222] text-white border-4 border-[#444] hover:border-freakYellow hover:text-freakYellow transition-all transform hover:-translate-y-2 hover:shadow-[8px_8px_0px_#E4DF33] cursor-pointer";
                    let disabled = isAnswered ? "disabled" : "";
                    
                    if (isAnswered) {
                        if (idx === data.correct) btnClass = "bg-green-400 text-freakDark border-4 border-green-600 font-black shadow-[8px_8px_0px_#14532d] z-10 scale-105";
                        else if (idx === selectedOpt && idx !== data.correct) btnClass = "bg-red-500 text-white border-4 border-red-700 opacity-80 shadow-[4px_4px_0px_#7f1d1d]";
                        else btnClass = "bg-[#111] text-gray-600 border-4 border-[#222] opacity-40";
                    }

                    // Split the option text into a bold title and a lighter subtitle for a modern button look
                    let formattedText = opt.replace(' (', '<span class="block text-sm font-normal opacity-80 mt-2">(').replace(')', ')</span>');

                    optionsHtml += `<button ${disabled} onclick="handleAnswer(${idx})" class="w-full text-center font-mont font-black text-3xl p-8 flex flex-col items-center justify-center ${btnClass}">${formattedText}</button>`;
                });

                let feedbackHtml = isAnswered ? `
                    <div class="mt-8 w-full max-w-5xl bg-freakYellow border-4 border-freakDark p-5 shadow-[8px_8px_0px_#30302F] animate-[fadeIn_0.3s_ease-out] flex items-center justify-between z-30">
                        <div class="pr-6 border-r-4 border-freakDark flex-1">
                            <h4 class="font-bree text-freakDark text-3xl uppercase mb-1">${selectedOpt === data.correct ? '🎯 SPOT ON!' : '⚠️ WRONG MOVE.'}</h4>
                            <p class="font-mont text-freakDark text-lg font-bold leading-snug">${data.rationale}</p>
                        </div>
                        <div class="pl-6 w-1/3 flex-shrink-0">
                            <div class="bg-white text-freakDark p-3 font-bold font-mont text-sm border-2 border-freakDark transform rotate-1 text-center shadow-md">
                                ${data.teacherPrompt}
                            </div>
                        </div>
                    </div>` : '';

                appContainer.innerHTML = `
                    <div class="w-full h-full bg-[#111] flex flex-col justify-center items-center relative p-12 pb-24">
                        
                        <!-- Floating Header -->
                        <div class="absolute top-8 left-12 flex items-center gap-4">
                            <div class="bg-freakYellow text-freakDark font-mont font-black px-4 py-1 transform -skew-x-12 text-xl">LEVEL ${data.level}</div>
                            <div class="text-gray-500 font-mont font-bold uppercase tracking-widest text-xl">${data.subtitle || "THE RECOGNITION"}</div>
                        </div>
                        <div class="absolute top-8 right-12 text-freakYellow font-mont font-black text-2xl">
                            ${data.qNum} / 10
                        </div>

                        <!-- Interrogation Card (Quote) -->
                        <div class="bg-freakDark border-4 border-freakBlue p-10 mb-8 mt-6 relative w-full max-w-5xl shadow-[12px_12px_0px_#93E5FF] transform -rotate-1">
                            <div class="absolute -top-10 -left-6 text-freakBlue text-[100px] font-bree leading-none">"</div>
                            <h3 class="text-white font-mont font-black text-[50px] text-center leading-tight relative z-10 px-8">
                                ${data.q}
                            </h3>
                            <div class="absolute -bottom-16 -right-4 text-freakBlue text-[100px] font-bree leading-none">"</div>
                        </div>

                        <!-- Interactive Options Grid -->
                        <div class="grid grid-cols-2 gap-8 w-full max-w-5xl">
                            ${optionsHtml}
                        </div>

                        <!-- Feedback Box -->
                        ${feedbackHtml}
                    </div>
                    ${buildNav(isAnswered)}
                `;
            }
            // LEVEL 2: PRESCRIPTION (Medical Pad UI)
            else if (data.qType === 'prescription') {
                const isAnswered = answeredQuestions.has(currentSlide);
                const selectedOpt = selectedAnswers[currentSlide];

                let optionsHtml = '';
                data.options.forEach((opt, idx) => {
                    let bgClass = "bg-[#eee] text-freakDark hover:bg-freakBlue hover:text-freakDark border-4 border-transparent hover:border-freakDark shadow-md";
                    let disabled = isAnswered ? "disabled" : "";
                    
                    if (isAnswered) {
                        if (idx === data.correct) bgClass = "bg-green-400 text-freakDark border-4 border-freakDark font-black shadow-none";
                        else if (idx === selectedOpt && idx !== data.correct) bgClass = "bg-red-400 text-white opacity-50";
                        else bgClass = "bg-gray-200 text-gray-400 opacity-50";
                    }

                    optionsHtml += `<button ${disabled} onclick="handleAnswer(${idx})" class="rounded-full px-10 py-4 font-mont font-bold text-2xl transition-all uppercase tracking-widest ${bgClass}">${opt}</button>`;
                });

                // Format the context to show the blank or the chosen answer
                let displayContext = data.context;
                if (isAnswered && selectedOpt === data.correct) {
                    displayContext = displayContext.replace('___', `<span class="text-green-600 underline uppercase">${data.options[data.correct]}</span>`);
                } else if (isAnswered) {
                    displayContext = displayContext.replace('___', `<span class="text-red-600 underline uppercase line-through">${data.options[selectedOpt]}</span> <span class="text-green-600 uppercase">${data.options[data.correct]}</span>`);
                } else {
                    displayContext = displayContext.replace('___', `<span class="text-freakBlue underline">______</span>`);
                }

                let feedbackHtml = isAnswered ? `
                    <div class="w-[650px] mt-8 bg-freakDark border-2 border-freakYellow p-4 text-white shadow-[6px_6px_0px_#E4DF33] animate-[fadeIn_0.3s_ease-out] z-20">
                        <p class="font-mont text-md font-bold mb-2">${data.rationale}</p>
                        <div class="text-freakBlue font-bold font-mont text-sm">${data.teacherPrompt}</div>
                    </div>` : '';

                appContainer.innerHTML = `
                    <div class="w-full h-full bg-[#1a1a1a] flex flex-col items-center justify-center relative p-8 pb-20">
                        <div class="absolute top-8 left-8 text-white font-mont font-black italic text-2xl opacity-50">Q${data.qNum}/30 | THE PRESCRIPTION</div>
                        
                        <!-- Prescription Pad -->
                        <div class="bg-white rounded-xl w-[650px] min-h-[350px] p-10 shadow-[16px_16px_0px_#93E5FF] relative text-freakDark flex flex-col border-4 border-freakDark z-10">
                            <!-- Header -->
                            <div class="border-b-4 border-freakDark pb-4 mb-8 flex justify-between items-end">
                                <div>
                                    <h2 class="font-bree text-3xl">GELMY'S CLINIC</h2>
                                    <p class="font-mont text-sm font-bold text-gray-500 uppercase mt-1">Patient: ${data.patient}</p>
                                </div>
                                <span class="font-bree text-5xl text-freakBlue">Rx</span>
                            </div>
                            
                            <!-- Content -->
                            <p class="font-mont text-3xl font-bold leading-relaxed mb-12 flex-grow">${displayContext}</p>
                            
                            <!-- Pill Options -->
                            <div class="w-full flex gap-8 justify-center mt-auto pb-4">
                                ${optionsHtml}
                            </div>
                        </div>
                        
                        ${feedbackHtml}
                    </div>
                    ${buildNav(isAnswered)}
                `;
            }
            // LEVEL 3: THE CLINIC (Open Input, Patient Files UI)
            else if (data.qType === 'diagnose') {
                const isAnswered = answeredQuestions.has(currentSlide);
                
                let contentHtml = '';

                if (!isGradingState && !isAnswered) {
                    contentHtml = `
                        <div class="bg-[#1e1e1e] border-l-8 border-freakYellow p-8 shadow-2xl relative mb-8">
                            <h3 class="text-freakYellow font-bree text-2xl mb-4 tracking-wider uppercase">SITUATION:</h3>
                            <p class="font-mont text-3xl font-bold text-white mb-8">"${data.issue}"</p>
                            
                            <div class="bg-black p-6 border-2 border-gray-700">
                                <p class="text-freakBlue font-mont font-bold text-sm uppercase mb-3">${data.prompt}</p>
                                <textarea id="diagnose-input" placeholder="Type your diagnosis here..." autocomplete="off"
                                    class="w-full bg-transparent text-white font-mont text-2xl outline-none resize-none border-b-4 border-gray-600 focus:border-freakYellow transition-colors h-16"></textarea>
                            </div>
                        </div>
                        <div class="flex justify-end">
                            <button onclick="submitWriting()" class="btn-freak bg-white hover:bg-freakYellow text-freakDark text-lg py-3 px-8 shadow-[6px_6px_0px_#111]">SAVE RECORD ➔</button>
                        </div>
                    `;
                } else if (isGradingState) {
                    const userText = selectedAnswers[currentSlide];
                    contentHtml = `
                        <div class="flex gap-6 mb-8 animate-[fadeIn_0.3s_ease-out]">
                            <!-- User Answer -->
                            <div class="w-1/2 bg-[#1e1e1e] border-t-8 border-freakYellow p-8 shadow-xl">
                                <h4 class="font-bree text-gray-500 text-lg mb-2">YOUR RECORD:</h4>
                                <p class="font-mont text-white text-2xl font-bold italic">"${userText}"</p>
                            </div>
                            <!-- Expected Answer -->
                            <div class="w-1/2 bg-white border-t-8 border-freakBlue p-8 shadow-xl">
                                <h4 class="font-bree text-gray-500 text-lg mb-2">FREAKN' EXAMPLES:</h4>
                                <p class="font-mont text-freakDark text-xl font-bold">${data.acceptable}</p>
                            </div>
                        </div>
                        
                        <div class="w-full bg-freakBlue p-4 mb-8 text-center shadow-md">
                            <p class="font-mont font-bold text-freakDark">${data.teacherPrompt}</p>
                        </div>

                        <!-- Grading Decision -->
                        <div class="bg-black border-2 border-gray-800 p-6 text-center">
                            <h3 class="font-bree text-white text-2xl mb-2">CLINICAL REVIEW</h3>
                            <p class="font-mont text-gray-400 text-sm mb-6">Did you use SHOULD or MUST correctly based on the prompt?</p>
                            <div class="flex justify-center gap-6">
                                <button onclick="selfGrade(false)" class="btn-freak bg-red-500 text-white hover:bg-red-600 shadow-none py-3 px-6">DENIED (0 PT)</button>
                                <button onclick="selfGrade(true)" class="btn-freak bg-green-500 text-white hover:bg-green-600 shadow-none py-3 px-6">APPROVED (+1 PT)</button>
                            </div>
                        </div>
                    `;
                } else if (isAnswered) {
                    const userText = selectedAnswers[currentSlide];
                    contentHtml = `
                         <div class="bg-[#1e1e1e] border-l-8 border-gray-600 p-8 shadow-xl opacity-50 mb-8">
                            <h4 class="font-bree text-gray-500 text-xl mb-4">RECORD SAVED:</h4>
                            <p class="font-mont text-gray-300 text-2xl font-bold">"${userText}"</p>
                        </div>
                        <div class="text-center font-mont text-freakYellow font-bold text-xl uppercase tracking-widest">Move to the next patient.</div>
                    `;
                }

                appContainer.innerHTML = `
                    <div class="w-full h-full bg-[#111] flex flex-col justify-center items-center relative p-8 pb-20">
                        <div class="absolute top-8 left-8 text-gray-600 font-mont font-black italic text-2xl">Q${data.qNum}/30 | PATIENT FILES</div>
                        
                        <div class="w-full max-w-5xl">
                            ${contentHtml}
                        </div>
                    </div>
                    ${buildNav(isAnswered && !isGradingState)}
                `;
                
                const inputEl = document.getElementById('diagnose-input');
                if(inputEl) inputEl.focus();
            }
            // OUTRO
            else if (data.type === 'outro') {
                const percentage = Math.round((score / 30) * 100);
                let message = "";
                if (percentage >= 90) message = "EXPERT DOCTOR. Gelmy is proud.";
                else if (percentage >= 70) message = "GOOD ADVICE. Keep practicing the rules.";
                else message = "MALPRACTICE. We need to review the basics.";

                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center text-center p-12 bg-freakYellow text-freakDark relative h-full">
                        <h1 class="font-bree text-[120px] mb-2 leading-none uppercase">CLINIC CLOSED</h1>
                        <div class="bg-freakDark text-white p-12 mt-8 w-[600px] shadow-[16px_16px_0px_#93E5FF]">
                            <h2 class="font-mont font-black italic text-3xl mb-4 text-gray-400">FINAL DIAGNOSIS</h2>
                            <p class="font-mont text-[100px] font-black text-freakYellow leading-none mb-4">${score} / 30</p>
                            <p class="font-mont text-2xl font-bold bg-white text-freakDark inline-block px-6 py-2 transform -skew-x-6 mt-4">${message}</p>
                        </div>
                        <div class="mt-16">
                            <button onclick="location.reload()" class="btn-freak bg-white text-freakDark hover:bg-freakBlue shadow-[6px_6px_0px_#111]">PLAY AGAIN ➔</button>
                        </div>
                    </div>
                `;

                FreaknActivity.submit({
                    activityId: "lesson-quiz",
                    title: document.title,
                    score: score,
                    maxScore: 30,
                    answers: buildFreaknAnswers()
                });
            }
        }

        window.handleAnswer = function(optIndex) {
            const data = lessonData[currentSlide];
            if (answeredQuestions.has(currentSlide)) return; 
            
            selectedAnswers[currentSlide] = optIndex;
            answeredQuestions.add(currentSlide);
            
            if (optIndex === data.correct) score++;
            
            renderSlide(); 
        }

        window.submitWriting = function() {
            const inputEl = document.getElementById('diagnose-input');
            const userText = inputEl ? inputEl.value.trim() : "";
            if (!userText) {
                inputEl.classList.add('border-red-500');
                return; 
            }
            selectedAnswers[currentSlide] = userText;
            isGradingState = true;
            renderSlide();
        }

        window.selfGrade = function(isCorrect) {
            isGradingState = false;
            answeredQuestions.add(currentSlide);
            writeGrades[currentSlide] = isCorrect;
            if (isCorrect) score++;
            nav(1);
        }

        window.nav = function(dir) {
            let nextSlide = currentSlide + dir;
            if (nextSlide >= 0 && nextSlide < lessonData.length) {
                currentSlide = nextSlide;
                renderSlide();
            } else if (nextSlide >= lessonData.length) {
                lessonData.push({type: 'outro'});
                currentSlide = lessonData.length -1;
                renderSlide();
            }
        
            if (window.__freaknSlide) window.__freaknSlide(currentSlide);
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && lessonData[currentSlide]?.qType === 'diagnose' && !isGradingState && !answeredQuestions.has(currentSlide)) {
                submitWriting();
            }
        });

        // Init
        renderSlide();
    </script>

<script>
    /* Memoria de slide (plataforma Freakn'). Una lección puede tomar dos o tres
       clases; sin esto cada clase volvía a empezar en el primer slide. */
    (function () {
        window.__freaknSlide = function (posicion) {
            try {
                parent.postMessage({
                    source: "freakn-lesson",
                    type: "freakn:slide",
                    payload: { slide: posicion }
                }, "*");
            } catch (e) {}
        };
        window.addEventListener("load", function () {
            var g = window.__freaknSlideInicial;
            if (g === undefined || g === null || g === "") return;
            /* Llega como texto. Las lecciones que navegan por número comparan
               con === y con una cadena no encontrarían nada. */
            var destino = /^[0-9]+$/.test(String(g)) ? Number(g) : g;
            if (destino === 0) return;
            try { nav(destino); } catch (e) {}
        });
    })();
</script>
</body>
</html>
