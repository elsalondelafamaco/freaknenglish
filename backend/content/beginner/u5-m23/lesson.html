<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5 Module 23 | Talent Show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        freakYellow: '#E4DF33',
                        freakDark: '#30302F',
                        freakBlue: '#93E5FF',
                        freakBg: '#111111'
                    },
                    fontFamily: {
                        bree: ['"Bree Serif"', 'serif'],
                        mont: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111111; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #app-container { width: 1280px; height: 720px; position: relative; background-color: #30302F; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        /* Typography System */
        .title-freak { font-family: 'Bree Serif', serif; font-weight: 400; text-transform: uppercase; }
        .text-freak { font-family: 'Montserrat', sans-serif; }
        
        /* Components */
        .btn-freak {
            background-color: #93E5FF; color: #30302F; font-family: 'Montserrat', sans-serif; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.05em; padding: 1rem 2rem; border: 4px solid #30302F;
            box-shadow: 4px 4px 0px #30302F; transition: all 0.2s ease; cursor: pointer;
        }
        .btn-freak:hover { background-color: #E4DF33; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #30302F; }
        .btn-freak:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; background-color: #ccc; }
        
        .slide-enter { animation: slideIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #30302F; }
        ::-webkit-scrollbar-thumb { background: #E4DF33; }

        @media (max-width: 820px) {
            body { overflow-y: auto; align-items: flex-start; height: auto; min-height: 100vh; }
            #app-container { width: 100%; height: auto; min-height: 100vh; box-shadow: none; }
            #slide-mount { flex-direction: column; height: auto; min-height: 100vh; }
            #slide-mount > div.w-1\/2.h-full { width: 100%; height: auto; min-height: 45vh; padding: 1.5rem 1rem !important; }
            [class~="pb-20"] { flex-direction: column !important; height: auto !important; overflow-y: auto; padding-bottom: 5.5rem !important; }
            [class*="w-[45%]"], [class*="w-[55%]"] { width: 100% !important; height: auto !important; padding: 1rem !important; }
            [class*="w-[380px]"] { width: 100% !important; max-width: 320px; height: 440px !important; }
            [class*="w-[500px]"] { width: 100% !important; }
            .title-freak.text-\[110px\] { font-size: 2.5rem; }
            h1.title-freak.text-8xl { font-size: 2.25rem; }
            h2.title-freak.text-7xl { font-size: 1.75rem; }
            h1.title-freak.text-8xl.leading-none { font-size: 2rem; }
            .font-mont.text-7xl { font-size: 2.5rem; }
            .font-bree.text-5xl { font-size: 1.75rem; }
            .text-3xl { font-size: 1.15rem; }
            .grid-cols-3 { grid-template-columns: 1fr; }
            .p-12 { padding: 1rem !important; }
            .p-16 { padding: 1rem !important; }
            .p-8 { padding: 0.75rem !important; }
            .btn-freak { min-height: 44px; font-size: 16px; }
            .absolute.bottom-6.w-full.px-12 { padding-left: 1rem !important; padding-right: 1rem !important; flex-wrap: wrap; gap: 0.5rem; }
            .w-\[380px\].h-\[550px\] { width: 100%; height: 440px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="slide-mount" class="w-full h-full flex slide-enter"></div>
    </div>

    <script>
        const lessonData = [
            // SLIDE 0: OBJECTIVE
            {
                type: 'intro',
                unitModule: "UNIT 5 • MODULE 23",
                title: "TALENT SHOW",
                objective: "Learn to talk about abilities, what animals and humans can do, and describe your own hidden talents.",
                bottomTag: "THE OBSERVER • PART 3"
            },
            
            // --- THE CHEAT CODE (GRAMMAR BASE) ---
            {
                type: 'cheatsheet',
                title: "THE CHEAT CODE",
                subtitle: "The street rules for talking about abilities.",
                rules: [
                    { title: "THE POWER WORD", desc: "Use CAN to say you have the ability. Use CAN'T to say you don't.", example: "I can swim. / I can't fly." },
                    { title: "NO CHANGES", desc: "CAN never changes. Do NOT add an 'S' for he/she/it.", example: "He can run.<br>NOT: He cans run." },
                    { title: "NO 'TO'", desc: "Put the action directly after CAN. Never use 'to'.", example: "She can jump.<br>NOT: She can to jump." }
                ]
            },

            // --- LEVEL 1: THE VIBE ---
            { type: 'transition', level: 1, title: "LEVEL 1: THE VIBE", desc: "The family is at the zoo talking about animal abilities. Pick the most logical action verb based on what the animal CAN or CAN'T do." },
            
            {
                type: 'q_vibe', level: 1, qNum: 1,
                context: "Gelmy: 'Mijo, look at that beautiful parrot! It's sad that it is locked in a cage and cannot...'",
                question: "What does the cage stop the parrot from doing?",
                options: ["...swim.", "...fly."],
                correct: 1,
                rationale: "Parrots are birds with wings. Their primary ability is to fly, and a cage stops them from flying, not swimming.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you think it's fair to keep birds in cages? Why?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 2,
                context: "Titó: 'Look at that shark in the big tank! It moves so fast in the water! It can...'",
                question: "What ability is Titó amazed by?",
                options: ["...swim really well.'", "...climb really well.'"],
                correct: 0,
                rationale: "Sharks live in the water, so their ability is swimming. They cannot climb because they don't have arms or legs.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Are you a good swimmer? Can you swim in the ocean?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 3,
                context: "El pa: 'Bro, the cheetah is insane. It's the fastest land animal in the world. It can...'",
                question: "What makes the cheetah the fastest?",
                options: ["...jump super high.'", "...run super fast.'"],
                correct: 1,
                rationale: "Speed on land is determined by the ability to 'run'. Jumping high is a different ability entirely.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Can you run fast? What is the fastest you have ever run?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 4,
                context: "Gelmy: 'Mijo, look at the kangaroo! Its back legs are gigantic and so strong! It can...'",
                question: "What do the kangaroo's back legs allow it to do?",
                options: ["...fly over the fences.'", "...jump really far.'"],
                correct: 1,
                rationale: "Kangaroos use their strong back legs to push off the ground and 'jump'. They cannot fly.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What other animal is famous for jumping?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 5,
                context: "Titó: 'Be careful with the monkeys! If they steal your hat, you won't get it back because they can...'",
                question: "What is the monkey's best escape ability?",
                options: ["...swim to the top of the tree.'", "...climb to the top of the tree.'"],
                correct: 1,
                rationale: "Trees are vertical objects. To go up a tree using arms and legs is to 'climb'. You cannot swim up a tree.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Could you climb trees when you were a kid?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 6,
                context: "El pa: 'Parce, an elephant is huge, heavy, and its legs are straight. It definitely cannot...'",
                question: "What is an elephant physically unable to do?",
                options: ["...jump in the air.'", "...drink water.'"],
                correct: 0,
                rationale: "Because of their massive weight and leg structure, elephants are one of the few mammals that cannot 'jump'. They certainly drink water.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What is your favorite wild animal and what can it do?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 7,
                context: "Gelmy: 'Titó, penguins are birds, but they are very special. They cannot ___, but they are amazing in the ocean.'",
                question: "What ability do penguins lack?",
                options: ["Swim.", "Fly."],
                correct: 1,
                rationale: "Penguins are birds that have lost the ability to 'fly', but they are excellent swimmers.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Would you rather have the ability to fly or to breathe underwater?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 8,
                context: "Titó: 'A snake is dangerous. It doesn't have arms or legs, so it cannot ___, but it moves fast!'",
                question: "What is physically impossible for a snake?",
                options: ["Run.", "Bite."],
                correct: 0,
                rationale: "Running requires legs. Since snakes have no legs, they cannot 'run'. They slither. (And they definitely can bite!)",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Are you scared of snakes or any other animal?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 9,
                context: "El pa: 'The lion is the king! When it sees a zebra, it can ___ super fast to catch its food.'",
                question: "How does the lion catch its prey on land?",
                options: ["Fly.", "Run."],
                correct: 1,
                rationale: "Lions are land predators that 'run' to catch their prey. They do not have wings to fly.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'If a lion was chasing you, could you survive? How?'"
            },
            {
                type: 'q_vibe', level: 1, qNum: 10,
                context: "Gelmy: 'Bears are scary. They are huge, they can run, they can swim, and they can even ___ trees to catch you!'",
                question: "What terrifying ability do bears have?",
                options: ["...climb...", "...fly..."],
                correct: 0,
                rationale: "Despite their size, bears have claws and strong arms that allow them to 'climb' trees perfectly.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What is the most dangerous animal in your country?'"
            },

            // --- LEVEL 2: THE GAME (Chat Interface) ---
            { type: 'transition', level: 2, title: "LEVEL 2: THE GAME", desc: "Real-world texting. The family is in weird situations involving talents and animal abilities. Pick the most logical advice." },

            {
                type: 'q_chat', level: 2, qNum: 11, sender: "El pa 🧢",
                incoming: "Bro, we're at the beach and there's a huge sign that says 'DANGER: Sharks in the water'. What should we do?",
                options: ["We can't fly here today. It's dangerous.", "We can't swim here today. It's dangerous."],
                correct: 1,
                rationale: "Sharks live in the water, meaning the water is dangerous. Logically, you 'can't swim' there.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Can you swim in the ocean where you live?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 12, sender: "Gelmy 👵",
                incoming: "Mijo, there is a big spider in my room! I put it in a box, but the box doesn't have a lid. What can it do?",
                options: ["It can fly away to the moon! Run!", "It can climb out of the box! Put a book on top!"],
                correct: 1,
                rationale: "Spiders use their legs to 'climb' walls and surfaces. Very few spiders can jump, but none can fly to the moon.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What do you do when you see a spider in your room?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 13, sender: "Titó 🤠",
                incoming: "I want to buy a horse for the farm. I need to move from the house to the river very quickly. I need an animal that can...",
                options: ["...run very fast with me on its back.", "...climb the trees with me."],
                correct: 0,
                rationale: "Horses are used for riding and 'running' across land. Horses cannot climb trees.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Can you ride a horse?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 14, sender: "El pa 🧢",
                incoming: "Parce, my dog is crazy. He saw a squirrel on the roof of the house and he wants to catch it. But dogs can't...",
                options: ["...eat food.", "...climb houses."],
                correct: 1,
                rationale: "Dogs can definitely eat food, but their paws are not built to 'climb' vertical walls or houses like cats can.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Do you have a pet? What funny things can it do?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 15, sender: "Gelmy 👵",
                incoming: "I watched a documentary about dolphins. They are so smart and beautiful! What is their best physical ability?",
                options: ["They can run very fast in the forest.", "They can swim incredibly fast in the ocean."],
                correct: 1,
                rationale: "Dolphins are marine mammals; their primary environment is the ocean, so their ability is to 'swim'.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Have you ever seen a dolphin or whale in real life?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 16, sender: "Titó 🤠",
                incoming: "Mijo, I'm watching an action movie. Can a normal, real person actually jump over a moving car?",
                options: ["No, a human cannot jump that high or far.", "Yes, anyone can fly over a car easily."],
                correct: 0,
                rationale: "In reality, the human ability to 'jump' is limited, and clearing a car is impossible for a normal person.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What is an action movie stunt you know you CANNOT do?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 17, sender: "El pa 🧢",
                incoming: "I'm watching a talent show. This guy says he can hold his breath underwater for 10 minutes!",
                options: ["Wow, he can climb like a monkey.", "Wow, he can swim and survive like a fish."],
                correct: 1,
                rationale: "Holding breath underwater is related to water activities like 'swimming', not climbing.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'How long can you hold your breath underwater?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 18, sender: "Gelmy 👵",
                incoming: "Your little cousin wants a pet bird. What is the most beautiful thing birds can do?",
                options: ["They can fly freely in the sky.", "They can run on the highway."],
                correct: 0,
                rationale: "The defining, beautiful characteristic of birds is their ability to 'fly' in the sky.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'If you could have any wild animal as a pet, what would it be?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 19, sender: "Titó 🤠",
                incoming: "We are doing an Escape Room game. The door is locked! Look, there is an open window at the top of the wall!",
                options: ["We have to swim up there!", "We have to climb up there!"],
                correct: 1,
                rationale: "To reach a window at the top of a wall, you must use your hands and feet to 'climb' up.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'Are you good at solving puzzles or escaping rooms?'"
            },
            {
                type: 'q_chat', level: 2, qNum: 20, sender: "El pa 🧢",
                incoming: "Bro, I want to learn Parkour. Those guys are insane. What do they actually do in the city?",
                options: ["They can jump between buildings and walls.", "They can swim in the air between buildings."],
                correct: 0,
                rationale: "Parkour is the physical discipline of using running and 'jumping' to clear obstacles. You can't swim in the air.",
                teacherPrompt: "👉 TEACHER: Ask the student: 'What is a dangerous sport you CANNOT do?'"
            },

            // --- LEVEL 3: THE CHALLENGE (Free Writing) ---
            { type: 'transition', level: 3, title: "LEVEL 3: THE CHALLENGE", desc: "No options. The family is asking you direct questions about what you or animals can do. Type your answers to prove your skills." },

            {
                type: 'q_write', level: 3, qNum: 21,
                character: "Titó", title: "THE WATER TEST",
                prompt: "Hey! Tell me, what is the one action verb a fish can do perfectly but a house cat absolutely hates doing?",
                acceptable: "Swim / Swimming",
                rationale: "Fish live in water and swim. Cats are notoriously afraid of swimming in water.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you prefer swimming in a pool or the ocean?'"
            },
            {
                type: 'q_write', level: 3, qNum: 22,
                character: "Gelmy", title: "THE WINGS",
                prompt: "Mijo, birds have wings. What is the action verb for moving through the air using wings?",
                acceptable: "Fly / Flying",
                rationale: "The physical action of moving through the air with wings is called flying.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Do you like flying in airplanes?'"
            },
            {
                type: 'q_write', level: 3, qNum: 23,
                character: "El pa", title: "THE CHASE",
                prompt: "Bro, if a wild cheetah is chasing you, what is the action verb for moving your legs as fast as possible to escape?",
                acceptable: "Run / Running",
                rationale: "Moving your feet rapidly to travel fast on land is running.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Can you run a marathon?'"
            },
            {
                type: 'q_write', level: 3, qNum: 24,
                character: "Titó", title: "THE MONKEY",
                prompt: "Monkeys love bananas that grow high up. What action verb do monkeys do to get from the ground to the top of the trees?",
                acceptable: "Climb / Climbing",
                rationale: "Going vertically up a tree using arms and legs is climbing.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Can you climb a rope?'"
            },
            {
                type: 'q_write', level: 3, qNum: 25,
                character: "Gelmy", title: "THE KANGAROO",
                prompt: "Mijo, kangaroos have giant back legs. What action verb describes how they push off the ground to move?",
                acceptable: "Jump / Jumping",
                rationale: "Pushing off the ground into the air is jumping.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Can you jump very high?'"
            },
            {
                type: 'q_write', level: 3, qNum: 26,
                character: "El pa", title: "THE SKILL CHECK",
                prompt: "Parce, be honest. Using the power word, tell me: Can you speak English perfectly right now?",
                acceptable: "No I can't / Yes I can / I can speak a little",
                rationale: "Uses the modal 'can' or 'can't' to express personal ability with a language.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'What other languages can you speak?'"
            },
            {
                type: 'q_write', level: 3, qNum: 27,
                character: "Titó", title: "THE SNAKE",
                prompt: "Think about a snake. Since it has absolutely no legs, tell me one movement action verb a snake CANNOT do.",
                acceptable: "Run / Walk / Jump",
                rationale: "Running, walking, and jumping strictly require the use of legs.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Can a snake climb a tree? (Yes, they can!)'"
            },
            {
                type: 'q_write', level: 3, qNum: 28,
                character: "Gelmy", title: "THE PENGUIN",
                prompt: "A penguin is technically a bird, but tell me the truth: Can a penguin fly in the sky?",
                acceptable: "No / No, it can't / It cannot fly",
                rationale: "Penguins are flightless birds; they use their wings as flippers for swimming.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Can a chicken fly?'"
            },
            {
                type: 'q_write', level: 3, qNum: 29,
                character: "El pa", title: "YOUR TALENT",
                prompt: "Bro, what is a secret talent you have? Write a sentence starting with 'I can...' to tell me what cool thing you CAN do.",
                acceptable: "I can [verb] (cook, play guitar, sing, dance...)",
                rationale: "Correctly uses the structure 'I can + base verb' to express a personal talent.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask the student to demonstrate or explain their secret talent!"
            },
            {
                type: 'q_write', level: 3, qNum: 30,
                character: "Titó", title: "THE BEST FRIEND",
                prompt: "Dogs are man's best friend. Tell me one physical action or sense that a dog can do much better than a human.",
                acceptable: "Run / Smell / Hear",
                rationale: "Dogs are significantly faster runners and have infinitely better senses of smell and hearing than humans.",
                teacherPrompt: "👉 TEACHER: Follow up! Ask: 'Can a dog understand English words?'"
            }
        ];

        let currentSlide = 0;
        let score = 0;
        let answeredQuestions = new Set();
        let selectedAnswers = {};
        let isGradingState = false;
        let freaknAnswers = [];
        let activityReported = false;

        const appContainer = document.getElementById('slide-mount');

        function renderSlide() {
            const data = lessonData[currentSlide];
            appContainer.innerHTML = '';
            appContainer.className = 'w-full h-full flex slide-enter'; 

            const buildNav = (isAnswered) => `
                <div class="absolute bottom-6 w-full px-12 flex justify-between items-center z-50">
                    <button onclick="nav(-1)" class="btn-freak bg-transparent text-white border-white hover:bg-white hover:text-freakDark shadow-none py-2 px-4 text-sm">PREVIOUS</button>
                    ${isAnswered && data.type !== 'q_write' ? `<button onclick="nav(1)" class="btn-freak bg-freakYellow animate-bounce">NEXT STEP ➔</button>` : ``}
                    ${isAnswered && data.type === 'q_write' && !isGradingState ? `<button onclick="nav(1)" class="btn-freak bg-freakYellow animate-bounce">NEXT STEP ➔</button>` : ``}
                </div>
            `;

            if (data.type === 'intro') {
                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center text-center p-12 bg-freakDark text-white relative h-full">
                        <div class="bg-freakYellow text-freakDark font-mont font-bold tracking-widest uppercase py-3 px-8 mb-8 transform -skew-x-12">
                            <span class="block transform skew-x-12 text-xl">${data.unitModule}</span>
                        </div>
                        <h1 class="title-freak text-[110px] text-freakYellow mb-8 leading-none max-w-4xl">${data.title}</h1>
                        <p class="text-freak text-3xl font-bold mb-16 max-w-4xl leading-relaxed">${data.objective}</p>
                        <div class="border-4 border-white py-3 px-10 mb-12">
                            <span class="font-mont font-black tracking-widest uppercase text-freakBlue text-2xl">${data.bottomTag}</span>
                        </div>
                        <div class="flex gap-6 absolute bottom-12">
                            <button class="btn-freak opacity-50 cursor-not-allowed text-sm py-3 px-6" disabled>PREVIOUS</button>
                            <button onclick="nav(1)" class="btn-freak bg-freakYellow hover:bg-freakBlue text-sm py-3 px-6">NEXT STEP ➔</button>
                        </div>
                    </div>
                `;
            } 
            else if (data.type === 'cheatsheet') {
                let rulesHtml = '';
                data.rules.forEach((rule, idx) => {
                    rulesHtml += `
                        <div class="bg-white p-8 border-4 border-freakDark shadow-[8px_8px_0px_#E4DF33] transform ${idx % 2 === 0 ? '-skew-x-2' : 'skew-x-2'} flex flex-col h-full">
                            <h3 class="font-bree text-2xl text-freakYellow mb-4 bg-freakDark inline-block px-4 py-2 self-start transform skew-x-2">${rule.title}</h3>
                            <p class="font-mont font-bold text-freakDark text-xl mb-6 flex-grow">${rule.desc}</p>
                            <div class="bg-gray-100 p-4 font-mont text-lg font-bold border-l-8 border-freakBlue text-freakDark">
                                ${rule.example}
                            </div>
                        </div>
                    `;
                });

                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center p-12 bg-[#1a1a1a] text-white relative h-full">
                        <div class="absolute top-8 left-8 text-gray-500 font-bree text-2xl">BEFORE WE PLAY...</div>
                        <h2 class="title-freak text-7xl text-freakYellow mb-4 mt-8">${data.title}</h2>
                        <p class="font-mont text-2xl font-bold mb-12 border-b-4 border-freakBlue pb-4 text-gray-300">${data.subtitle}</p>
                        
                        <div class="grid grid-cols-3 gap-8 w-full max-w-6xl">
                            ${rulesHtml}
                        </div>
                        
                        <div class="absolute bottom-8 right-12">
                            <button onclick="nav(1)" class="btn-freak bg-freakYellow hover:bg-freakBlue text-sm py-3 px-6 animate-bounce">GOT IT. LET'S PLAY ➔</button>
                        </div>
                        <div class="absolute bottom-8 left-12">
                            <button onclick="nav(-1)" class="btn-freak bg-transparent text-white border-white hover:bg-white hover:text-freakDark shadow-none py-3 px-6 text-sm">PREVIOUS</button>
                        </div>
                    </div>
                `;
            }
            else if (data.type === 'transition') {
                appContainer.innerHTML = `
                    <div class="w-1/2 h-full bg-freakYellow flex flex-col justify-center p-16">
                        <h1 class="title-freak text-8xl text-freakDark leading-none mb-6">${data.title}</h1>
                    </div>
                    <div class="w-1/2 h-full bg-freakDark flex flex-col justify-center items-start p-16 text-white relative">
                        <p class="text-freak text-3xl font-bold mb-12 border-l-8 border-freakBlue pl-6 leading-relaxed">${data.desc}</p>
                        <div class="absolute bottom-12 flex gap-6">
                            <button onclick="nav(-1)" class="btn-freak bg-transparent border-white text-white hover:bg-white hover:text-freakDark text-sm py-2 px-4">PREVIOUS</button>
                            <button onclick="nav(1)" class="btn-freak bg-freakBlue hover:bg-freakYellow">START LEVEL ➔</button>
                        </div>
                    </div>
                `;
            }
            // LEVEL 1: THE VIBE
            else if (data.type === 'q_vibe') {
                const isAnswered = answeredQuestions.has(currentSlide);
                const selectedOpt = selectedAnswers[currentSlide];

                let optionsHtml = '';
                data.options.forEach((opt, idx) => {
                    let btnClass = "bg-white text-freakDark hover:bg-gray-100 border-4 border-freakDark shadow-[4px_4px_0px_#30302F]";
                    let disabled = isAnswered ? "disabled" : "";
                    
                    if (isAnswered) {
                        if (idx === data.correct) btnClass = "bg-freakBlue text-freakDark border-4 border-freakDark shadow-[4px_4px_0px_#30302F]";
                        else if (idx === selectedOpt && idx !== data.correct) btnClass = "bg-red-400 text-white border-4 border-red-900 shadow-[4px_4px_0px_#7f1d1d] opacity-50";
                        else btnClass = "bg-gray-200 text-gray-500 border-4 border-gray-400 opacity-50";
                    }

                    optionsHtml += `<button ${disabled} onclick="handleAnswer(${idx})" class="text-left font-mont font-bold text-xl p-4 w-full transition-all ${btnClass}">${opt}</button>`;
                });

                let feedbackHtml = isAnswered ? `
                    <div class="mt-8 p-5 bg-gray-50 border-4 border-freakDark shadow-[6px_6px_0px_#30302F] animate-[slideIn_0.3s_ease-out]">
                        <h4 class="font-bree text-2xl mb-1">${selectedOpt === data.correct ? "<span class='text-green-600'>BOOM. CORRECT.</span>" : "<span class='text-red-600'>HOLD UP. INCORRECT.</span>"}</h4>
                        <p class="font-mont text-md font-bold mb-3">${data.rationale}</p>
                        <div class="bg-freakYellow text-freakDark p-3 font-bold font-mont text-sm transform -skew-x-2 border-2 border-freakDark">
                            ${data.teacherPrompt}
                        </div>
                    </div>` : '';

                appContainer.innerHTML = `
                    <div class="w-full h-full flex pb-20">
                        <div class="w-[45%] h-full bg-freakYellow p-12 flex flex-col justify-center relative">
                            <div class="absolute top-6 left-6 text-freakDark font-bree text-xl opacity-50">Q${data.qNum}/30 | THE VIBE</div>
                            <div class="bg-white text-freakDark p-8 border-4 border-freakDark shadow-[8px_8px_0px_#30302F] transform -rotate-1">
                                <p class="text-2xl leading-relaxed font-bree">${data.context}</p>
                            </div>
                        </div>
                        <div class="w-[55%] h-full bg-freakDark p-12 flex flex-col justify-center relative">
                            <h2 class="text-freakBlue font-bree text-3xl mb-6">${data.question}</h2>
                            <div class="flex flex-col gap-4">${optionsHtml}</div>
                            ${feedbackHtml}
                        </div>
                    </div>
                    ${buildNav(isAnswered)}
                `;
            }
            // LEVEL 2: THE GAME (Chat Interface)
            else if (data.type === 'q_chat') {
                const isAnswered = answeredQuestions.has(currentSlide);
                const selectedOpt = selectedAnswers[currentSlide];

                let optionsHtml = '';
                if (!isAnswered) {
                    data.options.forEach((opt, idx) => {
                        optionsHtml += `
                            <button onclick="handleAnswer(${idx})" class="w-full text-right bg-freakBlue text-freakDark font-mont font-bold text-sm p-4 rounded-2xl rounded-br-none border-2 border-freakDark hover:bg-freakYellow transition-all mb-3 shadow-[4px_4px_0px_#30302F]">
                                ${opt}
                            </button>
                        `;
                    });
                } else {
                    const isCorrect = selectedOpt === data.correct;
                    const bubbleColor = isCorrect ? 'bg-green-400' : 'bg-red-400';
                    optionsHtml = `
                        <div class="w-[85%] self-end text-right ${bubbleColor} text-freakDark font-mont font-bold text-sm p-4 rounded-2xl rounded-br-none border-2 border-freakDark shadow-[4px_4px_0px_#30302F] mb-3">
                            ${data.options[selectedOpt]}
                        </div>
                        <div class="text-right text-xs text-gray-500 font-mont italic pr-2">Read</div>
                    `;
                }

                let feedbackHtml = isAnswered ? `
                    <div class="bg-freakDark border-4 border-freakYellow p-6 text-white shadow-[8px_8px_0px_#E4DF33] animate-[slideIn_0.3s_ease-out]">
                        <h4 class="font-bree text-2xl mb-2 text-freakYellow">${selectedOpt === data.correct ? "STREET SMART." : "AWKWARD TEXT."}</h4>
                        <p class="font-mont text-md font-bold mb-4">${data.rationale}</p>
                        <div class="bg-freakYellow text-freakDark p-3 font-bold font-mont text-sm transform -skew-x-2">
                            ${data.teacherPrompt}
                        </div>
                    </div>` : `
                    <div class="h-full flex flex-col justify-center">
                        <h2 class="font-bree text-5xl text-freakYellow mb-4">YOUR TURN</h2>
                        <p class="font-mont text-xl text-white leading-relaxed">Read the incoming message. Choose the best reply to handle the situation.</p>
                    </div>`;

                appContainer.innerHTML = `
                    <div class="w-full h-full bg-[#1a1a1a] flex items-center justify-center gap-12 p-8 relative pb-20">
                        <div class="absolute top-6 left-6 text-white font-bree text-xl opacity-50">Q${data.qNum}/30 | THE GAME</div>
                        
                        <!-- Phone UI -->
                        <div class="w-[380px] h-[550px] bg-white rounded-[3rem] border-[12px] border-gray-800 p-4 flex flex-col relative shadow-2xl flex-shrink-0">
                            <!-- Notch -->
                            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-6 bg-gray-800 rounded-b-2xl"></div>
                            
                            <!-- Header -->
                            <div class="text-center font-bold font-mont border-b-2 border-gray-200 pb-3 mt-4 mb-4 text-freakDark">
                                ${data.sender}
                            </div>
                            
                            <!-- Chat Area -->
                            <div class="flex-1 overflow-y-auto flex flex-col pr-2">
                                <!-- Incoming -->
                                <div class="w-[85%] bg-gray-200 text-freakDark font-mont font-medium text-sm p-4 rounded-2xl rounded-bl-none mb-6">
                                    ${data.incoming}
                                </div>
                                
                                <!-- Options / Sent -->
                                <div class="mt-auto flex flex-col items-end w-full">
                                    ${optionsHtml}
                                </div>
                            </div>
                        </div>

                        <div class="w-[500px]">
                            ${feedbackHtml}
                        </div>
                    </div>
                    ${buildNav(isAnswered)}
                `;
            }
            // LEVEL 3: THE CHALLENGE (Unstructured Text Input)
            else if (data.type === 'q_write') {
                const isAnswered = answeredQuestions.has(currentSlide);
                
                let contentHtml = '';

                if (!isGradingState && !isAnswered) {
                    // State 1: Input
                    contentHtml = `
                        <div class="bg-white p-8 border-4 border-freakDark shadow-[8px_8px_0px_#E4DF33] relative mb-8">
                            <div class="absolute -top-5 -left-5 bg-freakBlue text-freakDark font-bree text-xl px-4 py-1 border-4 border-freakDark transform -rotate-3">${data.character}</div>
                            <p class="font-mont text-2xl font-bold text-freakDark mb-6">${data.prompt}</p>
                            <input type="text" id="write-input" placeholder="Type your answer here..." autocomplete="off"
                                class="w-full bg-gray-100 border-4 border-gray-300 text-freakDark p-4 font-mont text-2xl font-bold outline-none focus:border-freakBlue transition-all">
                        </div>
                        <div class="flex justify-end">
                            <button onclick="submitWriting()" class="btn-freak bg-freakYellow hover:bg-freakBlue text-xl py-4 px-8">REVEAL ANSWER ➔</button>
                        </div>
                    `;
                } else if (isGradingState) {
                    // State 2: Self-Grading (Teacher Check)
                    const userText = selectedAnswers[currentSlide];
                    contentHtml = `
                        <div class="flex gap-6 mb-6 animate-[slideIn_0.3s_ease-out]">
                            <!-- Left: User Answer -->
                            <div class="w-1/2 bg-gray-800 border-4 border-gray-600 p-6 shadow-[6px_6px_0px_#30302F]">
                                <h4 class="font-bree text-freakYellow text-xl mb-4">YOU WROTE:</h4>
                                <p class="font-mont text-white text-2xl font-bold italic">"${userText}"</p>
                            </div>
                            <!-- Right: Expected Answer -->
                            <div class="w-1/2 bg-white border-4 border-freakDark p-6 shadow-[6px_6px_0px_#93E5FF]">
                                <h4 class="font-bree text-freakBlue text-xl mb-4">FREAKN' ACCEPTABLE ANSWERS:</h4>
                                <p class="font-mont text-freakDark text-2xl font-bold">${data.acceptable}</p>
                                <p class="font-mont text-gray-500 text-sm mt-3 border-t-2 border-gray-200 pt-2">${data.rationale}</p>
                            </div>
                        </div>
                        
                        <!-- Teacher Prompt inside grading -->
                        <div class="w-full bg-freakBlue border-4 border-freakDark p-3 mb-6 transform -skew-x-2 shadow-[4px_4px_0px_#30302F]">
                            <p class="font-mont font-bold text-freakDark text-center">${data.teacherPrompt}</p>
                        </div>

                        <!-- Self-Grade Decision -->
                        <div class="bg-freakDark border-4 border-freakYellow p-4 text-center transform skew-x-2">
                            <h3 class="font-bree text-freakYellow text-2xl mb-2">THE VIBE CHECK</h3>
                            <p class="font-mont text-white text-md mb-4">Be honest. Did your answer capture the right meaning and verb form?</p>
                            <div class="flex justify-center gap-6">
                                <button onclick="selfGrade(false)" class="btn-freak bg-red-400 text-white border-red-900 shadow-[4px_4px_0px_#7f1d1d] hover:bg-red-500 py-2 px-4 text-sm">I MESSED UP</button>
                                <button onclick="selfGrade(true)" class="btn-freak bg-green-400 text-freakDark border-green-900 shadow-[4px_4px_0px_#14532d] hover:bg-green-500 py-2 px-4 text-sm">I GOT IT (+1 PT)</button>
                            </div>
                        </div>
                    `;
                } else if (isAnswered) {
                    // State 3: Reviewed
                    const userText = selectedAnswers[currentSlide];
                    contentHtml = `
                         <div class="bg-gray-800 border-4 border-gray-600 p-6 shadow-[6px_6px_0px_#30302F] opacity-50 mb-8">
                            <h4 class="font-bree text-gray-400 text-xl mb-2">YOU WROTE:</h4>
                            <p class="font-mont text-gray-300 text-2xl font-bold">"${userText}"</p>
                        </div>
                        <div class="text-center font-mont text-freakYellow font-bold text-xl">Answer recorded. Move to the next step.</div>
                    `;
                }

                appContainer.innerHTML = `
                    <div class="w-full h-full bg-[#111] flex flex-col justify-center items-center relative p-8 pb-20">
                        <div class="absolute top-6 left-6 text-gray-600 font-bree text-xl">Q${data.qNum}/30 | THE CHALLENGE</div>
                        
                        <div class="w-full max-w-4xl">
                            <h2 class="text-freakBlue font-bree text-4xl mb-2 text-center uppercase">${data.title}</h2>
                            <p class="text-gray-400 font-mont text-md mb-6 text-center">Read the prompt and type your answer. You are your own coach.</p>
                            
                            ${contentHtml}
                        </div>
                    </div>
                    ${buildNav(isAnswered && !isGradingState)}
                `;
                
                const inputEl = document.getElementById('write-input');
                if(inputEl) inputEl.focus();
            }
            // OUTRO
            else if (data.type === 'outro') {
                const percentage = Math.round((score / 30) * 100);
                let message = "";
                if (percentage >= 90) message = "ABSOLUTE LEGEND. You own this vocabulary.";
                else if (percentage >= 70) message = "SOLID WORK. You survived the streets.";
                else message = "WE NEED TO TALK. Time to review the basics.";

                if (!activityReported) {
                    activityReported = true;
                    FreaknActivity.submit({
                        activityId: "lesson-quiz",
                        title: document.title,
                        score: score,
                        maxScore: 30,
                        answers: freaknAnswers
                    });
                }

                appContainer.innerHTML = `
                    <div class="w-full flex flex-col justify-center items-center text-center p-12 bg-freakYellow text-freakDark relative h-full">
                        <h1 class="title-freak text-8xl mb-4">LESSON COMPLETE</h1>
                        <div class="bg-freakDark text-white p-12 mt-8 border-8 border-white shadow-[12px_12px_0px_#30302F] transform skew-y-2">
                            <h2 class="font-bree text-4xl mb-4">YOUR SCORE</h2>
                            <p class="font-mont text-7xl font-black text-freakBlue mb-4">${score} / 30</p>
                            <p class="font-mont text-2xl font-bold">${message}</p>
                        </div>
                        <div class="mt-16 flex gap-6">
                            <button onclick="location.reload()" class="btn-freak bg-white hover:bg-freakBlue">RESTART LESSON</button>
                        </div>
                    </div>
                `;
            }
        }

        window.handleAnswer = function(optIndex) {
            const data = lessonData[currentSlide];
            if (answeredQuestions.has(currentSlide)) return; 
            
            selectedAnswers[currentSlide] = optIndex;
            answeredQuestions.add(currentSlide);

            if (optIndex === data.correct) score++;

            freaknAnswers.push({
                id: 'q' + data.qNum,
                question: data.question || data.incoming,
                answer: data.options[optIndex],
                correct: optIndex === data.correct,
                expected: data.options[data.correct]
            });

            renderSlide();
        }

        window.submitWriting = function() {
            const inputEl = document.getElementById('write-input');
            const userText = inputEl ? inputEl.value.trim() : "";
            if (!userText) {
                inputEl.classList.add('border-red-500');
                return; 
            }
            selectedAnswers[currentSlide] = userText;
            isGradingState = true;
            renderSlide();
        }

        window.selfGrade = function(isCorrect) {
            const data = lessonData[currentSlide];
            freaknAnswers.push({
                id: 'q' + data.qNum,
                question: data.prompt,
                answer: selectedAnswers[currentSlide],
                correct: isCorrect,
                expected: data.acceptable
            });
            isGradingState = false;
            answeredQuestions.add(currentSlide);
            if (isCorrect) score++;
            nav(1);
        }

        window.nav = function(dir) {
            let nextSlide = currentSlide + dir;
            if (nextSlide >= 0 && nextSlide < lessonData.length) {
                currentSlide = nextSlide;
                renderSlide();
            } else if (nextSlide >= lessonData.length) {
                lessonData.push({type: 'outro'});
                currentSlide = lessonData.length -1;
                renderSlide();
            }
        
            if (window.__freaknSlide) window.__freaknSlide(currentSlide);
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && lessonData[currentSlide]?.type === 'q_write' && !isGradingState && !answeredQuestions.has(currentSlide)) {
                submitWriting();
            }
        });

        renderSlide();
    </script>

    <script>
      /* FREAKN ACTIVITY API v1 — puente con la plataforma.
         Si el HTML se abre fuera de la app, no hace nada (no rompe). */
      window.FreaknActivity = (function () {
        function post(type, payload) {
          try { parent.postMessage({ source: "freakn-lesson", type: type, payload: payload }, "*"); }
          catch (e) {}
        }
        return {
          /** Reporta el resultado de una actividad calificable. */
          submit: function (r) {
            post("freakn:activity:result", {
              activityId: r.activityId,          // id estable dentro del archivo
              title: r.title || document.title,  // nombre legible
              score: r.score,                    // puntos obtenidos
              maxScore: r.maxScore,              // puntaje máximo
              answers: r.answers || []           // ver formato abajo
            });
          },
          /** Marca la lección como vista/terminada (sin puntaje). */
          complete: function () { post("freakn:lesson:complete", {}); }
        };
      })();
    </script>

<script>
    /* Memoria de slide (plataforma Freakn'). Una lección puede tomar dos o tres
       clases; sin esto cada clase volvía a empezar en el primer slide. */
    (function () {
        window.__freaknSlide = function (posicion) {
            try {
                parent.postMessage({
                    source: "freakn-lesson",
                    type: "freakn:slide",
                    payload: { slide: posicion }
                }, "*");
            } catch (e) {}
        };
        window.addEventListener("load", function () {
            var g = window.__freaknSlideInicial;
            if (g === undefined || g === null || g === "") return;
            /* Llega como texto. Las lecciones que navegan por número comparan
               con === y con una cadena no encontrarían nada. */
            var destino = /^[0-9]+$/.test(String(g)) ? Number(g) : g;
            if (destino === 0) return;
            try { nav(destino); } catch (e) {}
        });
    })();
</script>
</body>
</html>
