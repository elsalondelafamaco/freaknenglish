<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Lesson 0 · Welcome to FreaknEnglish</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #FFFDF5; color: #1a1a1a; margin: 0; padding: 24px; }
    .slide { width: 900px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { color: #1a1a1a; border-bottom: 4px solid #FBE34B; display: inline-block; padding-bottom: 4px; }
    .vocab { display: flex; gap: 16px; margin: 20px 0; }
    .vocab .card { flex: 1; background: #FEF6C7; border-radius: 12px; padding: 16px; text-align: center; }
    .vocab .en { font-size: 20px; font-weight: 700; }
    .vocab .es { font-size: 13px; color: #555; }
    .quiz { margin-top: 28px; border-top: 1px solid #eee; padding-top: 20px; }
    .q { margin-bottom: 18px; }
    .q p { font-weight: 600; margin: 0 0 8px; }
    .q label { display: block; padding: 8px 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
    .q label:hover { background: #FEF6C7; }
    button.check { background: #1a1a1a; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 700; cursor: pointer; }
    #result { margin-top: 14px; font-weight: 700; }
  </style>
<!-- FREAKN-STANDARD v1 · Inyectado por scripts/process-lesson.mjs.
     1) Overrides responsive genéricos (no tocan la identidad visual de la lección).
     2) Bridge FreaknActivity: contrato estándar para reportar resultados a la
        plataforma vía postMessage (el LessonViewer lo escucha y guarda). -->
<style id="freakn-responsive">
  /* Base fluida: nada puede desbordar el iframe. */
  html, body { max-width: 100vw; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  * , *::before, *::after { box-sizing: border-box; }
  img, video, iframe, canvas, svg { max-width: 100% !important; height: auto; }
  table { display: block; max-width: 100%; overflow-x: auto; }
  pre { white-space: pre-wrap; word-break: break-word; }

  /* Contenedores con ancho fijo (patrón común en estas lecciones) → fluidos. */
  [style*="width:"][style*="px"], .container, .slide, .card, .wrapper, .content, main, section {
    max-width: 100% !important;
  }

  @media (max-width: 640px) {
    html { font-size: 15px; }
    body { padding-left: 12px !important; padding-right: 12px !important; }
    /* Grillas/filas rígidas → columna en mobile. */
    [class*="row"], [class*="grid"], [class*="columns"], [class*="flex"] {
      flex-wrap: wrap !important;
    }
    h1 { font-size: 1.6rem !important; line-height: 1.2 !important; }
    h2 { font-size: 1.3rem !important; }
    button, input, select, textarea { font-size: 16px; } /* evita zoom iOS */
  }
</style>
<script id="freakn-bridge">
  (function () {
    "use strict";
    /**
     * Bridge estándar Freakn ↔ plataforma.
     * Las actividades llaman FreaknActivity.submit({...}) al calificar.
     * Contrato del payload:
     *   activityId: string   — id estable dentro de la lección (requerido)
     *   title?:     string   — nombre legible de la actividad
     *   score?:     number   — puntos obtenidos
     *   maxScore?:  number   — puntaje máximo
     *   answers?:   Array<{ id, question, answer, correct?, expected? }>
     */
    var pending = [];
    function post(type, payload) {
      try {
        window.parent.postMessage({ source: "freakn-lesson", type: type, payload: payload }, "*");
      } catch (e) { /* fuera de la plataforma: no-op */ }
    }
    window.FreaknActivity = {
      submit: function (payload) {
        if (!payload || !payload.activityId) {
          console.warn("[freakn] submit sin activityId — ignorado", payload);
          return;
        }
        var clean = {
          activityId: String(payload.activityId),
          title: payload.title ? String(payload.title) : undefined,
          score: typeof payload.score === "number" ? payload.score : undefined,
          maxScore: typeof payload.maxScore === "number" ? payload.maxScore : undefined,
          answers: Array.isArray(payload.answers) ? payload.answers : [],
        };
        pending.push(clean);
        post("freakn:activity:result", clean);
      },
      /** Marca la lección como vista hasta el final (opcional). */
      complete: function () { post("freakn:lesson:complete", {}); },
    };
    // Aviso de que la lección cargó con bridge (para telemetría del viewer).
    post("freakn:lesson:ready", { url: location.href });
  })();
</script>

</head>
<body>
  <div class="slide">
    <h1>Welcome! · Greetings básicos</h1>
    <p>Estas son las tres formas más comunes de saludar en inglés. Léelas en voz alta:</p>
    <div class="vocab">
      <div class="card"><div class="en">Hello</div><div class="es">Hola (neutro)</div></div>
      <div class="card"><div class="en">Hi</div><div class="es">Hola (informal)</div></div>
      <div class="card"><div class="en">Good morning</div><div class="es">Buenos días</div></div>
    </div>

    <div class="quiz" id="quiz">
      <h2>Mini quiz</h2>
      <div class="q" data-q="q1">
        <p>1. ¿Cómo saludas a tu jefe a las 8 a.m.?</p>
        <label><input type="radio" name="q1" value="Hi"> Hi</label>
        <label><input type="radio" name="q1" value="Good morning"> Good morning</label>
        <label><input type="radio" name="q1" value="Yo!"> Yo!</label>
      </div>
      <div class="q" data-q="q2">
        <p>2. "Hi" es un saludo…</p>
        <label><input type="radio" name="q2" value="formal"> Formal</label>
        <label><input type="radio" name="q2" value="informal"> Informal</label>
      </div>
      <button class="check" onclick="grade()">Calificar</button>
      <div id="result"></div>
    </div>
  </div>

  <script>
    var KEY = { q1: "Good morning", q2: "informal" };
    var QUESTIONS = {
      q1: "¿Cómo saludas a tu jefe a las 8 a.m.?",
      q2: '"Hi" es un saludo…',
    };
    function grade() {
      var answers = [];
      var score = 0;
      Object.keys(KEY).forEach(function (q) {
        var sel = document.querySelector('input[name="' + q + '"]:checked');
        var val = sel ? sel.value : null;
        var ok = val === KEY[q];
        if (ok) score++;
        answers.push({ id: q, question: QUESTIONS[q], answer: val, correct: ok, expected: KEY[q] });
      });
      document.getElementById("result").textContent =
        "Resultado: " + score + "/" + Object.keys(KEY).length;
      // ── Estándar Freakn: reporta el resultado a la plataforma ──
      if (window.FreaknActivity) {
        FreaknActivity.submit({
          activityId: "quiz-greetings",
          title: "Mini quiz: Greetings",
          score: score,
          maxScore: Object.keys(KEY).length,
          answers: answers,
        });
      }
    }
  </script>
</body>
</html>
